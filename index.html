<script>
const DATA = {"TAGS":{"ambition":"Ambition","banquo":"Banquo & contrast","fate":"Fate & the supernatural","language":"Language & technique","appearance":"Appearance vs reality","context":"Context","ahead":"Look ahead","key13":"★ Scene 1.3 evidence"},"hours":[{"title":"Lesson 1","subtitle":"Scenes 1.1, 1.2 and the start of 1.3","steps":[{"type":"aims","key":"h1-aims","short":"Aims","mins":5,"title":"Today’s lesson","doNow":{"title":"Do now: best guesses welcome","qa":[{"q":"Macbeth is about a soldier who becomes king. What could make an ordinary person do something terrible to get what they want?","a":"Ambition, jealousy, fear, or pressure from someone else. Keep your ideas: we will test them on Macbeth."},{"q":"What does the word ‘ambition’ mean? Is it always a good thing?","a":"A strong wish to achieve something, such as success or power. It can be good (working hard) or bad (if you hurt others to get it)."},{"q":"Which is stronger: fate (things are meant to happen) or choice (we decide what happens)?","a":"There is no right answer. Macbeth keeps asking this question."}]}},{"type":"context","key":"h1-ctx","short":"Before","mins":4,"title":"Before we begin","lead":"Talk first, then tap a card to check your idea.","blocks":[{"h":"When and for whom?","t":"Written around 1606 for King James I of England, who was also King James VI of Scotland. Shakespeare set the play in Scotland, James’s home country.","prompt":"Macbeth is about 400 years old. Who do you think it was written for?"},{"h":"Why witches?","t":"James was fascinated by witchcraft and had written a book about it (Daemonologie, 1597). Many people at the time believed witches were real and dangerous.","prompt":"Why might a king be afraid of witches?"},{"h":"Why does treason matter?","t":"In 1605 the Gunpowder Plot tried to blow up Parliament and kill James. People also believed kings were chosen by God, so killing a king was a crime against God as well as the country.","prompt":"Why might treason (plotting against the king) be seen as the worst crime of all?"},{"h":"What kind of play?","t":"A tragedy: a great person falls because of their own choices. Watch Macbeth closely from the very start, because the man we meet now is the man we will compare later.","prompt":"What does ‘tragedy’ mean? Who usually falls in a tragedy?"}],"side":{"title":"Four ideas to track","items":[{"h":"Ambition","t":"What does Macbeth want, and how does it change him?"},{"h":"Fair and foul","t":"Appearances that hide the truth."},{"h":"Fate and choice","t":"Are events destined, or does Macbeth choose?"},{"h":"Loyalty and betrayal","t":"Who can be trusted?"}]}},{"type":"extract","key":"e1","short":"1.1 Witches","mins":8,"label":"Extract 1","title":"Act 1, Scene 1: the witches","sub":"The whole scene","setup":"Three witches open the play. Listen to the rhythm of their speech, and look for words that sound like opposites.","task":"Underline two words or phrases that make the witches sound strange or unnatural.","lines":[{"k":"st","t":"Thunder and Lightning. Enter three Witches.","key":"s0"},{"k":"sp","t":"First Witch"},{"k":"ln","n":1,"t":"When shall we three meet again?"},{"k":"ln","n":2,"t":"In thunder, lightning, or in rain?"},{"k":"sp","t":"Second Witch"},{"k":"ln","n":3,"t":"When the hurly-burly’s done,"},{"k":"ln","n":4,"t":"When the battle’s lost and won."},{"k":"sp","t":"Third Witch"},{"k":"ln","n":5,"t":"That will be ere the set of sun."},{"k":"sp","t":"First Witch"},{"k":"ln","n":6,"t":"Where the place?"},{"k":"sp","t":"Second Witch"},{"k":"ln","n":7,"t":"Upon the heath."},{"k":"sp","t":"Third Witch"},{"k":"ln","n":8,"t":"There to meet with Macbeth."},{"k":"sp","t":"First Witch"},{"k":"ln","n":9,"t":"I come, Graymalkin."},{"k":"sp","t":"Second Witch"},{"k":"ln","n":10,"t":"Paddock calls."},{"k":"sp","t":"Third Witch"},{"k":"ln","n":11,"t":"Anon."},{"k":"sp","t":"All"},{"k":"ln","n":12,"t":"Fair is foul, and foul is fair;"},{"k":"ln","n":13,"t":"Hover through the fog and filthy air."},{"k":"st","t":"They exit.","key":"s1"}],"notes":[{"id":"n1-1","stage":"s0","phrase":"Thunder and Lightning","title":"A storm to open the play","meaning":"Before anyone speaks, we get thunder and lightning. The weather matches the mood: something is wrong.","effect":"Nature reflecting the mood is called pathetic fallacy. Shakespeare’s audience believed witches could raise storms, so this signals that the supernatural is at work.","ask":"What mood does a storm create before a word is spoken?","tags":["language","context"]},{"id":"n1-2","at":1,"phrase":"When shall we three meet again?","title":"The witches open the play","meaning":"The play begins with three witches arranging their next meeting, not with a king or a hero.","effect":"We learn at once that supernatural forces are involved. King James, watching the play, took witches very seriously.","ask":"How is this different from how you would expect a play about a soldier to start?","tags":["fate","context"]},{"id":"n1-3","at":3,"phrase":"hurly-burly","title":"Word to know: hurly-burly","meaning":"‘Hurly-burly’ means noisy chaos or uproar. Here it means the battle.","effect":"The witches know exactly when the battle will end. They seem to know things ordinary people cannot.","ask":"What does this suggest about their powers?","tags":["language","fate"]},{"id":"n1-4","at":4,"phrase":"the battle’s lost and won","title":"Paradox","meaning":"A battle can’t be both lost and won, unless you think about the two sides: one side loses and one wins.","effect":"The witches speak in contradictions. This hints that Macbeth may win the battle but lose something bigger.","ask":"Who might ‘lose’ by winning?","tags":["language","ambition","ahead"]},{"id":"n1-5","at":8,"phrase":"There to meet with Macbeth.","title":"Macbeth is named","meaning":"We hear Macbeth’s name before he appears. The witches are already waiting for him.","effect":"It makes Macbeth feel like a target, or a chosen one. Is he drawn in, or does he walk in willingly?","ask":"Do the witches choose Macbeth, or does Macbeth choose them?","tags":["fate","ambition"]},{"id":"n1-6","at":9,"phrase":"Graymalkin","title":"Familiars","meaning":"In folklore, witches had animal helpers called familiars. Graymalkin is a grey cat and Paddock (next line) is a toad. They are calling the witches away.","effect":"This roots the witches in real superstitions that the audience would have recognised.","tags":["context"]},{"id":"n1-7","at":12,"phrase":"Fair is foul, and foul is fair;","title":"Paradox: the play’s big idea","meaning":"Good looks bad and bad looks good. Right and wrong swap places.","effect":"Appearances can’t be trusted. Macbeth’s first words in the play will echo this, linking him to the witches before they even meet.","ask":"Where might something ‘fair’ hide something ‘foul’ later in the play?","tags":["language","appearance","ahead"]},{"id":"n1-8","at":13,"phrase":"fog and filthy air","title":"A murky setting","meaning":"Fog hides things and makes it hard to see clearly. ‘Filthy air’ suggests corruption.","effect":"The setting matches the theme: in this play nothing is clear, and the line between right and wrong gets blurred.","tags":["language","appearance"]}],"scene":"1.1","thinkSecs":30,"think":"With a partner (30 seconds): which two words make the witches sound strange? Decide before we look at the notes.","taskSupport":"Underline the two lines that sound most like a spell or chant. Write one word for how they make you feel.","taskStretch":"Choose one line and explain what makes it sound unnatural. Use a technique word (for example paradox, rhyme or contrast).","gloss":[["hurly-burly","noisy chaos"],["heath","wild, open land"],["Graymalkin","a grey cat, a witch’s helper"],["Paddock","a toad, another helper"],["Anon","soon"]]},{"type":"link","key":"l1","short":"What next","mins":3,"title":"What happens next","text":"Scene 1 ends with the witches planning to meet {{Macbeth}} on the heath. Their chant, ‘Fair is foul, and foul is {{fair}}’, warns us that things may not be what they {{seem}}. In Scene 2 we move to a military camp, where King {{Duncan}} meets a wounded {{Captain}} fresh from the battlefield. The Captain describes how Macbeth fought so {{fiercely}} that he cut the rebel leader open. Then he fixed his {{head}} on the castle walls. Macbeth is presented as a loyal and {{brave}} soldier.","track":"Tracker: nothing to add yet. Remember ‘fair is foul’ because we will hear it again.","ext":"Why might Shakespeare show us Macbeth’s bravery before we hear him speak?"},{"type":"extract","key":"e2","short":"1.2 Captain","mins":8,"label":"Extract 2","title":"Act 1, Scene 2: the Captain’s report","sub":"An extract","setup":"King Duncan has been told about the battle by a wounded Captain. Listen to how Macbeth is described. This is our ‘before’ picture of him.","task":"Circle two words or phrases the Captain uses to describe Macbeth. What impression do they give?","lines":[{"k":"sp","t":"Captain"},{"k":"ln","n":18,"t":"For brave Macbeth (well he deserves that name),"},{"k":"ln","n":19,"t":"Disdaining Fortune, with his brandished steel,"},{"k":"ln","n":20,"t":"Which smoked with bloody execution,"},{"k":"ln","n":21,"t":"Like Valor’s minion, carved out his passage"},{"k":"ln","n":22,"t":"Till he faced the slave;"},{"k":"ln","n":23,"t":"Which ne’er shook hands, nor bade farewell to him,"},{"k":"ln","n":24,"t":"Till he unseamed him from the nave to th’ chops,"},{"k":"ln","n":25,"t":"And fixed his head upon our battlements."},{"k":"sp","t":"Duncan"},{"k":"ln","n":26,"t":"O valiant cousin, worthy gentleman!"},{"k":"gap","t":"[…Ross arrives from Fife: the Norwegian king, helped by the traitor Thane of Cawdor, has been beaten…]"},{"k":"sp","t":"Duncan"},{"k":"ln","n":73,"t":"No more that Thane of Cawdor shall deceive"},{"k":"ln","n":74,"t":"Our bosom interest. Go, pronounce his present"},{"k":"ln","n":75,"t":"death,"},{"k":"ln","n":76,"t":"And with his former title greet Macbeth."},{"k":"sp","t":"Ross"},{"k":"ln","n":77,"t":"I’ll see it done."},{"k":"sp","t":"Duncan"},{"k":"ln","n":78,"t":"What he hath lost, noble Macbeth hath won."},{"k":"st","t":"They exit.","key":"s1"}],"notes":[{"id":"n2-1","at":18,"phrase":"brave Macbeth (well he deserves that name)","title":"First impressions","meaning":"Macbeth is introduced through someone else’s praise. He is so brave that he deserves the word ‘brave’ as his name.","effect":"We meet him as a hero before we hear him speak. This is the ‘before’ picture to compare with the Macbeth we see later.","ask":"Which qualities does the Captain admire? Add them to your tracker.","tags":["ambition"],"revise":true},{"id":"n2-2","at":19,"phrase":"Disdaining Fortune","title":"Ignoring fate","meaning":"‘Disdaining’ means looking down on. ‘Fortune’ means luck or fate. Macbeth ignores luck and relies on his own sword.","effect":"Later Macbeth will put his faith in fate and the witches’ words (‘If chance will have me king…’ in 1.3). Watch how this changes.","tags":["fate","ambition","ahead"],"revise":true},{"id":"n2-3","at":20,"phrase":"smoked with bloody execution","title":"Violent imagery","meaning":"His sword was steaming with the blood of the men he killed.","effect":"In battle this violence is heroic. The play will keep asking when killing stops being brave and becomes murder.","ask":"Is this description admiring or horrifying? Could it be both?","tags":["language","ambition"]},{"id":"n2-4","at":21,"phrase":"Valor’s minion","title":"Personification","meaning":"‘Minion’ means favourite. Valor (bravery) is treated like a person, and Macbeth is its favourite.","effect":"Macbeth sounds almost god-like. The higher he is raised, the further he has to fall.","tags":["language"]},{"id":"n2-5","at":24,"phrase":"unseamed him from the nave to th’ chops","title":"Shocking violence","meaning":"He sliced the rebel open from the navel to the jaw.","effect":"Duncan loves hearing this. Macbeth’s violence is used for the king here. Later it will be used against him.","ask":"‘Unseamed’ makes a body sound like a piece of clothing. What effect does that have?","tags":["language","ambition"]},{"id":"n2-6","at":25,"phrase":"fixed his head upon our battlements","title":"A head on the wall","meaning":"Traitors’ heads were displayed on walls as a warning to others.","effect":"Remember this image: at the very end of the play it is Macbeth’s own head that is carried in (5.8). We will come back to this pattern much later.","tags":["ahead","ambition"]},{"id":"n2-7","at":26,"phrase":"O valiant cousin, worthy gentleman!","title":"Duncan’s trust","meaning":"Duncan calls Macbeth ‘cousin’ (a close relative) and ‘worthy’.","effect":"Duncan is warm and generous. The more he trusts and loves Macbeth, the worse Macbeth’s later betrayal will be.","ask":"How does Shakespeare want us to feel about Duncan?","tags":["ambition","ahead"]},{"id":"n2-8","from":73,"to":74,"title":"A trusted man betrays the king","meaning":"The old Thane of Cawdor betrayed Duncan. ‘Our bosom interest’ means the king’s closest, most private trust.","effect":"Duncan was fooled by a man he trusted. This is another case of ‘fair is foul’: a loyal face hiding a traitor. It is about to happen again.","ask":"Who else might look loyal but not be?","tags":["appearance","ahead"]},{"id":"n2-9","at":76,"phrase":"And with his former title greet Macbeth.","title":"The reward","meaning":"Duncan gives Macbeth the traitor’s title, Thane of Cawdor, as a reward.","effect":"Macbeth doesn’t know yet. So when the witches call him Thane of Cawdor in 1.3, the prophecy is already true without his knowing, which makes them seem all-powerful.","tags":["fate"]},{"id":"n2-10","at":78,"phrase":"What he hath lost, noble Macbeth hath won.","title":"An echo of the witches","meaning":"What Cawdor lost, Macbeth gained.","effect":"‘Lost’ and ‘won’ echo the witches’ ‘lost and won’ in 1.1. Macbeth’s success comes from someone else’s downfall: a first hint that winning has a cost.","ask":"Where else have we heard ‘lost and won’?","tags":["language","fate","ambition"]}],"scene":"1.2","thinkSecs":30,"think":"With a partner (30 seconds): which words tell us Macbeth is brave? Which words might worry us?","taskSupport":"Circle two words that show Macbeth is a good soldier. Finish: ‘The Captain shows Macbeth is … because …’","taskStretch":"Choose one violent phrase. Explain how it can be read as both admiring and worrying.","gloss":[["Disdaining","looking down on"],["Fortune","luck or fate"],["minion","a favourite"],["nave","navel (belly button)"],["chops","jaws"],["bosom interest","closest trust"]]},{"type":"link","key":"l2","short":"What next","mins":3,"title":"What happens next","text":"Ross arrives and reports that the Thane of {{Cawdor}} has betrayed Duncan by helping the Norwegian army. Duncan orders his {{execution}} and gives the title to Macbeth: ‘What he hath lost, noble Macbeth hath {{won}}.’ Macbeth does not know yet that he has been rewarded. In Scene 3 the witches meet again and boast about the {{storms}} they can cause. One plans revenge on a sailor’s wife who refused to share her {{chestnuts}}. When they hear a {{drum}}, they know Macbeth is near and finish their {{charm}}.","track":"Tracker: start Macbeth’s ambition grid with ‘brave Macbeth’ and ‘Disdaining Fortune’ (1.2). This is your ‘before’ picture.","hinge":{"q":"In 1.2 Duncan gives Macbeth the title Thane of Cawdor. Why?","opts":["Because Macbeth asked for it.","Because the old Thane of Cawdor betrayed Duncan.","Because the witches told Duncan to.","Because Macbeth is Duncan’s son."],"correct":1,"why":"The old Thane of Cawdor helped the Norwegian army, so Duncan rewards Macbeth’s loyalty with the traitor’s title. The witches have not met Macbeth yet."},"ext":"Duncan’s ‘lost and won’ echoes the witches. What might Shakespeare be suggesting?"},{"type":"extract","key":"e3","short":"1.3 Meeting","mins":15,"label":"Extract 3","title":"Act 1, Scene 3: the meeting on the heath","sub":"An extract","setup":"Macbeth and Banquo, walking home from the battle, meet the witches. Compare how each man reacts.","task":"Star one line where Macbeth and Banquo react differently to the witches. Write a short note in the margin.","lines":[{"k":"sp","t":"Macbeth"},{"k":"ln","n":39,"t":"So foul and fair a day I have not seen."},{"k":"sp","t":"Banquo"},{"k":"ln","n":40,"t":"How far is ’t called to Forres?—What are these,"},{"k":"ln","n":41,"t":"So withered, and so wild in their attire,"},{"k":"ln","n":42,"t":"That look not like th’ inhabitants o’ th’ Earth"},{"k":"ln","n":43,"t":"And yet are on ’t?—Live you? Or are you aught"},{"k":"ln","n":44,"t":"That man may question? You seem to understand"},{"k":"ln","n":45,"t":"me"},{"k":"ln","n":46,"t":"By each at once her choppy finger laying"},{"k":"ln","n":47,"t":"Upon her skinny lips. You should be women,"},{"k":"ln","n":48,"t":"And yet your beards forbid me to interpret"},{"k":"ln","n":49,"t":"That you are so."},{"k":"sp","t":"Macbeth"},{"k":"ln","n":50,"t":"Speak if you can. What are you?"},{"k":"sp","t":"First Witch"},{"k":"ln","n":51,"t":"All hail, Macbeth! Hail to thee, Thane of Glamis!"},{"k":"sp","t":"Second Witch"},{"k":"ln","n":52,"t":"All hail, Macbeth! Hail to thee, Thane of Cawdor!"},{"k":"sp","t":"Third Witch"},{"k":"ln","n":53,"t":"All hail, Macbeth, that shalt be king hereafter!"},{"k":"sp","t":"Banquo"},{"k":"ln","n":54,"t":"Good sir, why do you start and seem to fear"},{"k":"ln","n":55,"t":"Things that do sound so fair?—I’ th’ name of truth,"},{"k":"ln","n":56,"t":"Are you fantastical, or that indeed"},{"k":"ln","n":57,"t":"Which outwardly you show? My noble partner"},{"k":"ln","n":58,"t":"You greet with present grace and great prediction"},{"k":"ln","n":59,"t":"Of noble having and of royal hope,"},{"k":"ln","n":60,"t":"That he seems rapt withal. To me you speak not."},{"k":"ln","n":61,"t":"If you can look into the seeds of time"},{"k":"ln","n":62,"t":"And say which grain will grow and which will not,"},{"k":"ln","n":63,"t":"Speak, then, to me, who neither beg nor fear"},{"k":"ln","n":64,"t":"Your favors nor your hate."},{"k":"sp","t":"First Witch"},{"k":"ln","n":65,"t":"Hail!"},{"k":"sp","t":"Second Witch"},{"k":"ln","n":66,"t":"Hail!"},{"k":"sp","t":"Third Witch"},{"k":"ln","n":67,"t":"Hail!"},{"k":"sp","t":"First Witch"},{"k":"ln","n":68,"t":"Lesser than Macbeth and greater."},{"k":"sp","t":"Second Witch"},{"k":"ln","n":69,"t":"Not so happy, yet much happier."},{"k":"sp","t":"Third Witch"},{"k":"ln","n":70,"t":"Thou shalt get kings, though thou be none."},{"k":"ln","n":71,"t":"So all hail, Macbeth and Banquo!"},{"k":"sp","t":"First Witch"},{"k":"ln","n":72,"t":"Banquo and Macbeth, all hail!"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":73,"t":"Stay, you imperfect speakers. Tell me more."},{"k":"ln","n":74,"t":"By Sinel’s death I know I am Thane of Glamis."},{"k":"ln","n":75,"t":"But how of Cawdor? The Thane of Cawdor lives"},{"k":"ln","n":76,"t":"A prosperous gentleman, and to be king"},{"k":"ln","n":77,"t":"Stands not within the prospect of belief,"},{"k":"ln","n":78,"t":"No more than to be Cawdor. Say from whence"},{"k":"ln","n":79,"t":"You owe this strange intelligence or why"},{"k":"ln","n":80,"t":"Upon this blasted heath you stop our way"},{"k":"ln","n":81,"t":"With such prophetic greeting. Speak, I charge you."},{"k":"st","t":"Witches vanish.","key":"s81"},{"k":"sp","t":"Banquo"},{"k":"ln","n":82,"t":"The earth hath bubbles, as the water has,"},{"k":"ln","n":83,"t":"And these are of them. Whither are they vanished?"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":84,"t":"Into the air, and what seemed corporal melted,"},{"k":"ln","n":85,"t":"As breath into the wind. Would they had stayed!"},{"k":"sp","t":"Banquo"},{"k":"ln","n":86,"t":"Were such things here as we do speak about?"},{"k":"ln","n":87,"t":"Or have we eaten on the insane root"},{"k":"ln","n":88,"t":"That takes the reason prisoner?"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":89,"t":"Your children shall be kings."},{"k":"sp","t":"Banquo"},{"k":"ln","n":90,"t":"You shall be king."},{"k":"sp","t":"Macbeth"},{"k":"ln","n":91,"t":"And Thane of Cawdor too. Went it not so?"},{"k":"sp","t":"Banquo"},{"k":"ln","n":92,"t":"To th’ selfsame tune and words.—Who’s here?"},{"k":"st","t":"Enter Ross and Angus.","key":"s92"}],"notes":[{"id":"n3-1","at":39,"phrase":"So foul and fair","title":"Macbeth echoes the witches","meaning":"The day is ‘foul’ (stormy weather) but also ‘fair’ (a great victory).","effect":"These are Macbeth’s very first words in the play, and they copy the witches’ ‘fair is foul’ pattern before he has heard them speak. It suggests he already belongs in their world of confusion.","ask":"Why might Shakespeare give Macbeth these words as his first line?","tags":["language","fate","appearance","key13"],"support":"Macbeth’s first line has two opposite words: ___ and ___. This links him to the witches because ___.","stretch":"Is Macbeth already ‘in their world’, or just describing the weather? Argue both sides.","revise":true},{"id":"n3-2","from":41,"to":42,"title":"Banquo studies the witches","meaning":"‘Withered’ means shrivelled. Banquo says they don’t look as if they belong on Earth, yet they are standing on it.","effect":"Banquo notices details and asks careful questions. Compare this with how Macbeth reacts.","tags":["banquo","appearance"]},{"id":"n3-3","at":48,"phrase":"your beards forbid me to interpret","title":"Not what they seem","meaning":"They look like women but have beards, so Banquo can’t work out what they are.","effect":"Another example of appearance not matching reality. It also makes the witches unsettling and unnatural.","tags":["appearance","language"]},{"id":"n3-4","from":51,"to":53,"title":"Three prophecies","meaning":"Three greetings, three titles: Thane of Glamis (what he already is), Thane of Cawdor (what he doesn’t know he is), and king hereafter (in the future).","effect":"The first two are true. The third is the dangerous one. Notice the pattern of three, which is typical of spells.","ask":"Which prophecy might be the most tempting, and why?","tags":["fate","ambition","key13"],"support":"The three greetings are ___, ___ and ___. The most dangerous is ___ because ___.","stretch":"Why might Shakespeare give three greetings rather than one? What effect does the build-up have?"},{"id":"n3-5","from":54,"to":55,"title":"Banquo notices Macbeth’s fear","meaning":"Banquo sees Macbeth ‘start’ (jump in fear) even though the news sounds good (‘fair’).","effect":"Why would good news frighten a loyal soldier? It suggests Macbeth already has a dark thought in his mind. Banquo spots it, and so does the audience.","ask":"What might Macbeth be afraid of?","tags":["ambition","banquo","key13"],"support":"Banquo notices that Macbeth ___ even though the news sounds ___. This suggests Macbeth is thinking about ___.","stretch":"Why does Banquo’s question make the audience suspect Macbeth before he says anything?","revise":true},{"id":"n3-6","at":56,"phrase":"Are you fantastical","title":"Banquo questions the witches","meaning":"‘Fantastical’ means imaginary. Banquo asks: are you real, or only in our imagination?","effect":"Banquo stays sceptical and wants proof. He asks whether they are what they seem, whereas Macbeth only asks them to say more.","tags":["banquo","appearance","key13"],"support":"Banquo asks if the witches are real. This shows he is ___ (cautious or trusting) because ___.","stretch":"‘Fantastical’ and ‘fair is foul’ both question what is real. How do they connect?"},{"id":"n3-7","from":61,"to":64,"title":"Banquo is not afraid","meaning":"He uses a metaphor: the future is like seeds, and the witches can tell which will grow. He says he neither begs for their favour nor fears their hatred.","effect":"Banquo stays independent and calm. Macbeth is fascinated and shaken. Great evidence for your comparison.","ask":"Which of them seems more in control?","tags":["banquo","language","key13"],"support":"Banquo says he does not ___ or ___ the witches. This shows he is ___.","stretch":"The seeds-and-grain metaphor imagines the future as something that grows. What does this suggest about fate?","revise":true},{"id":"n3-8","from":68,"to":69,"title":"More paradoxes","meaning":"Banquo will be lesser than Macbeth (never king) but greater (his family will be kings). He is less fortunate, but also happier.","effect":"The witches keep speaking in riddles, like ‘fair is foul’ and ‘lost and won’. Riddles can mislead: they tell the truth in a confusing way.","tags":["language","banquo","fate"]},{"id":"n3-9","at":70,"phrase":"Thou shalt get kings, though thou be none.","title":"Banquo’s prophecy","meaning":"‘Get’ means father. You will father kings even though you won’t be king yourself.","effect":"Banquo will never be king, but his descendants will. This will trouble Macbeth later. King James claimed to be descended from Banquo, so Shakespeare was flattering the king.","tags":["banquo","fate","context","key13"],"support":"The witches tell Banquo his ___ will be kings. This could make Macbeth feel ___.","stretch":"Shakespeare flatters King James through Banquo. Does knowing that change how we see Banquo?","revise":true},{"id":"n3-10","at":73,"phrase":"Stay, you imperfect speakers. Tell me more.","title":"Macbeth wants more","meaning":"‘Stay’ means stop. He calls them ‘imperfect speakers’ because they have given him only half the story.","effect":"Macbeth gives orders and is hungry for more. Banquo asks whether they can be trusted, but Macbeth only asks for more. This is one of the first signs of his ambition.","ask":"What does Macbeth want? What does Banquo want?","tags":["ambition","banquo","key13"],"support":"Macbeth says ‘Tell me more’. This shows he is ___ because ___.","stretch":"‘Imperfect speakers’: is Macbeth criticising the witches, or revealing his own greed?","revise":true},{"id":"n3-11","from":75,"to":78,"title":"Macbeth argues it away","meaning":"Cawdor is alive and doing well. Being king is even harder to believe than being Cawdor.","effect":"Macbeth says it is impossible, but he keeps asking. He is not planning anything yet, but the idea has caught him.","tags":["ambition"]},{"id":"n3-12","stage":"s81","phrase":"Witches vanish.","title":"They disappear","meaning":"The witches vanish, which is proof that they are supernatural.","effect":"Because they leave no trace, the men can doubt whether it really happened. Banquo doubts it, while Macbeth wishes they had stayed. Their reactions split here.","tags":["fate"]},{"id":"n3-13","from":82,"to":83,"title":"Banquo explains it away","meaning":"Banquo says the earth has bubbles, like water: they appear and pop. The witches were like bubbles, here and gone.","effect":"He looks for a natural explanation. Banquo prefers logic to magic.","tags":["banquo"]},{"id":"n3-14","from":86,"to":88,"title":"Banquo doubts his senses","meaning":"The ‘insane root’ is a plant that could make people see things or lose their reason. Banquo asks: did we eat something that ‘takes the reason prisoner’?","effect":"Banquo’s first thought is that they were tricked, not chosen. Macbeth’s first thought is ‘I wish they had stayed’. Sceptic against believer.","ask":"Which reaction is wiser? Which is more dangerous?","tags":["banquo","key13"],"support":"Banquo’s first thought is that ___. Macbeth’s first thought is ___.","stretch":"Which reaction would a Jacobean audience find more sensible? Why?","revise":true},{"id":"n3-15","from":89,"to":90,"title":"Each remembers the other’s prophecy","meaning":"Macbeth repeats Banquo’s prediction (‘Your children shall be kings’), and Banquo repeats Macbeth’s.","effect":"Macbeth mentions Banquo’s prophecy first. Later he cannot bear the thought of Banquo’s children being kings, and has Banquo killed (Act 3).","tags":["banquo","ambition","ahead"]}],"scene":"1.3","thinkSecs":30,"think":"With a partner (30 seconds): what is different about how Macbeth and Banquo speak to the witches?","taskSupport":"Star Banquo’s questions to the witches (lines 54–64). Finish: ‘Banquo is … because …’","taskStretch":"Write two sentences comparing how Macbeth and Banquo react. Use one quotation from each man.","gloss":[["aught","anything"],["fantastical","imaginary"],["rapt","completely absorbed"],["hereafter","in the future"],["corporal","having a body"],["insane root","a plant that makes you see things"],["get (kings)","father (kings)"]]},{"type":"link","key":"l3","short":"What next","mins":3,"title":"What happens next","text":"After the prophecies, the witches {{vanish}}. Banquo is {{sceptical}}: he wonders whether they have eaten a plant that makes people see things, the ‘insane root’. Macbeth, however, wishes they had {{stayed}}, and reminds Banquo that his {{children}} will be kings. Macbeth is already {{fascinated}} by the prophecy, while Banquo tries to explain it away. Then Ross and Angus arrive with a message from the king. Macbeth has been named Thane of {{Cawdor}}, so one of the witches’ predictions has already come {{true}}.","track":"Tracker: fill in the first row of the Macbeth and Banquo table. How does each man react to the witches?","ext":"Banquo doubts the witches while Macbeth wants more. Whose reaction is more dangerous, and why?"},{"type":"plenary","key":"h1-end","short":"Exit","mins":6,"title":"Exit ticket","ticket":[{"lvl":"core","q":"What does ‘fair is foul, and foul is fair’ tell us about the play?","a":"Things are not what they seem: something that looks good can hide something bad, and the other way round."},{"lvl":"core","q":"Give one word or phrase from Act 1 Scene 2 that shows Macbeth is brave.","a":"For example ‘brave Macbeth’, ‘Disdaining Fortune’, ‘Valor’s minion’, or ‘unseamed him from the nave to th’ chops’."},{"lvl":"stretch","q":"In one or two sentences, how is Banquo’s reaction to the witches different from Macbeth’s? Use a quotation.","a":"Banquo questions them (‘Are you fantastical…?’) and says he does not beg or fear their favours, whereas Macbeth demands more (‘Stay, you imperfect speakers. Tell me more.’)."}],"next":"Next lesson: Ross and Angus bring news that changes everything. Watch how quickly Macbeth’s thoughts change."}],"aims":{"li":"To understand how Shakespeare introduces Macbeth, the witches and Banquo, and to spot how the two men react differently.","sc":["I can explain what ‘fair is foul, and foul is fair’ tells us about the play.","I can describe how Macbeth is presented before he meets the witches, using a short quotation.","I can compare how Macbeth and Banquo react to the witches, giving evidence for each."],"stretch":"I can explain how a technique, such as paradox, makes a line more powerful.","word":{"w":"paradox","m":"a statement that seems to contradict itself but still holds a truth.","eg":"‘Fair is foul, and foul is fair.’ Use the word in one sentence today."},"bridge":"","bigger":["Now: collect evidence in your tracker","Lesson 4: comprehension on Act 1 Scene 3","A paragraph on Lady Macbeth","An essay on Macbeth’s ambition and how he changes, compared with Banquo and Macduff"]}},{"title":"Lesson 2","subtitle":"The rest of Scene 1.3","steps":[{"type":"aims","key":"h2-aims","short":"Aims","mins":6,"title":"Today’s lesson","doNow":{"title":"Do now: what do you remember?","qa":[{"q":"What three greetings do the witches give Macbeth?","a":"Thane of Glamis, Thane of Cawdor, and king hereafter."},{"q":"What do they promise Banquo?","a":"His children will be kings, though he will not be king himself."},{"q":"How do Macbeth and Banquo react differently to the witches?","a":"Macbeth is startled and wants more information. Banquo questions the witches and suspects he has been tricked."}]}},{"type":"extract","key":"e4","short":"1.3 News","mins":8,"label":"Extract 4","title":"Act 1, Scene 3: the king’s message","sub":"An extract","setup":"Ross and Angus arrive with a message from the king. Watch how quickly one prediction comes true, and how each man responds.","task":"Underline Banquo’s first reaction. What does it suggest he suspects?","lines":[{"k":"sp","t":"Ross"},{"k":"ln","n":109,"t":"And for an earnest of a greater honor,"},{"k":"ln","n":110,"t":"He bade me, from him, call thee Thane of Cawdor,"},{"k":"ln","n":111,"t":"In which addition, hail, most worthy thane,"},{"k":"ln","n":112,"t":"For it is thine."},{"k":"sp","t":"Banquo"},{"k":"ln","n":113,"t":"What, can the devil speak true?"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":114,"t":"The Thane of Cawdor lives. Why do you dress me"},{"k":"ln","n":115,"t":"In borrowed robes?"},{"k":"sp","t":"Angus"},{"k":"ln","n":116,"t":"Who was the Thane lives yet,"},{"k":"ln","n":117,"t":"But under heavy judgment bears that life"},{"k":"ln","n":118,"t":"Which he deserves to lose. Whether he was"},{"k":"gap","t":"[…]"},{"k":"ln","n":123,"t":"But treasons capital, confessed and proved,"},{"k":"ln","n":124,"t":"Have overthrown him."},{"k":"sp","t":"Macbeth (aside)"},{"k":"ln","n":125,"t":"Glamis and Thane of Cawdor!"},{"k":"ln","n":126,"t":"The greatest is behind. [To Ross and Angus.] Thanks"},{"k":"ln","n":127,"t":"for your pains."}],"notes":[{"id":"n4-1","at":109,"phrase":"an earnest of a greater honor","title":"A down-payment","meaning":"‘Earnest’ means a first payment, or a promise of more to come. Cawdor is only the start.","effect":"Duncan means more rewards will follow. To Macbeth, who has just been told ‘king hereafter’, ‘a greater honor’ could sound like a promise of the crown. Watch for ‘earnest’ in his next speech.","tags":["language","ambition","key13"],"support":"‘Earnest’ means ___. Macbeth may hear ‘a greater honor’ as ___.","stretch":"Ross means more rewards, but Macbeth may hear ‘the crown’. How can one phrase mean two things?"},{"id":"n4-2","at":111,"phrase":"hail, most worthy thane","title":"‘Hail’ again","meaning":"Ross uses the witches’ word ‘hail’.","effect":"The human world echoes the supernatural one, so the prophecy seems even more real.","tags":["fate","language"]},{"id":"n4-3","at":113,"phrase":"What, can the devil speak true?","title":"Banquo’s suspicion","meaning":"Banquo wonders aloud whether the devil can tell the truth.","effect":"Banquo’s first reaction to a prophecy coming true is suspicion. He guesses that evil could be at work. Macbeth’s reaction is to want more.","ask":"What does this line tell us about Banquo?","tags":["banquo","fate","key13"],"support":"Banquo suspects ___. He says this ___ (aloud or secretly), which shows ___.","stretch":"Banquo has the same information as Macbeth. Why do they draw different conclusions?","revise":true},{"id":"n4-4","from":114,"to":115,"title":"Borrowed robes","meaning":"Macbeth says the title belongs to someone else, like wearing borrowed clothes.","effect":"Clothing imagery returns again and again in the play, with titles that don’t fit. Here Macbeth objects honestly. Notice how quickly that changes.","tags":["language","ambition"]},{"id":"n4-5","at":123,"phrase":"treasons capital, confessed and proved,","title":"Treason means death","meaning":"‘Capital’ means punishable by death. Cawdor has confessed, so his punishment is certain.","effect":"Treason is the worst crime in this world. Macbeth is standing right next to a warning about it.","ask":"Why might Shakespeare remind us of the punishment for treason now?","tags":["ahead","ambition"]},{"id":"n4-6","at":125,"phrase":"Glamis and Thane of Cawdor!","title":"Two truths","meaning":"Two of the witches’ three greetings have now come true.","effect":"The first two were true, so the third suddenly seems believable. To Macbeth this is proof that the witches can predict the future.","tags":["fate","ambition"]},{"id":"n4-7","at":126,"phrase":"The greatest is behind.","title":"‘The greatest is behind’","meaning":"‘Behind’ means still to come. King is the greatest title, and it is still to come.","effect":"A few lines ago Macbeth said becoming king was beyond belief. Now he calls it the next step. This is a big shift in his thinking, so mark it in your tracker.","ask":"What has changed in his mind since line 77?","tags":["ambition","key13"],"support":"Earlier in 1.3 Macbeth says being king is ___. Now he says ‘The greatest is behind’, which means ___.","stretch":"How quickly does Macbeth’s view of becoming king change? Which words show the shift?","revise":true}],"scene":"1.3","thinkSecs":30,"think":"With a partner (30 seconds): what does Banquo think about the news? What does Macbeth think?","taskSupport":"Underline ‘What, can the devil speak true?’ Finish: ‘Banquo suspects …’","taskStretch":"Compare Banquo’s reaction with Macbeth’s ‘The greatest is behind.’ What does the contrast show?","gloss":[["earnest","a first payment, or promise of more"],["thane","a Scottish lord"],["addition","a title"],["capital (treasons)","punishable by death"],["behind","still to come"]]},{"type":"link","key":"l4","short":"What next","mins":4,"title":"What happens next","text":"Angus explains that the old Thane of Cawdor is a traitor who will be {{executed}}. Two of the witches’ predictions have now come true, so Macbeth’s mind jumps to the third: ‘The {{greatest}} is behind.’ He asks Banquo whether he hopes his {{children}} will be kings. Banquo replies with a {{warning}}. Evil forces may tell us small {{truths}} to win our trust, and then {{betray}} us when it matters most. Macbeth ignores this. He steps aside to speak his private thoughts in an {{aside}}, which the audience hears but the other characters do not.","track":"Tracker: add ‘The greatest is behind’ to the ambition grid. What has changed since 1.2?","hinge":{"q":"Banquo says ‘What, can the devil speak true?’ What is he suggesting?","opts":["That Macbeth is lying.","That the witches’ predictions might be an evil trick.","That he is jealous of Macbeth.","That he wants to be Thane of Cawdor."],"correct":1,"why":"Banquo is suspicious. If the witches can tell a truth, that might be a way of winning trust before something worse."},"ext":"Why might Banquo’s warning matter more to the audience than to Macbeth?"},{"type":"extract","key":"e5","short":"1.3 Aside","mins":25,"label":"Extract 5","title":"Act 1, Scene 3: Banquo’s warning and Macbeth’s aside","sub":"An extract","setup":"‘Aside’ means words the audience hears but the other characters don’t. Listen for how Macbeth reasons with himself, and how Banquo reacts.","task":"Highlight the moment Macbeth first imagines something terrible. What might he be picturing?","lines":[{"k":"sp","t":"Macbeth (aside to Banquo)"},{"k":"ln","n":128,"t":"Do you not hope your children"},{"k":"ln","n":129,"t":"shall be kings,"},{"k":"ln","n":130,"t":"When those that gave the Thane of Cawdor to me"},{"k":"ln","n":131,"t":"Promised no less to them?"},{"k":"sp","t":"Banquo"},{"k":"ln","n":132,"t":"That, trusted home,"},{"k":"ln","n":133,"t":"Might yet enkindle you unto the crown,"},{"k":"ln","n":134,"t":"Besides the Thane of Cawdor. But ’tis strange."},{"k":"ln","n":135,"t":"And oftentimes, to win us to our harm,"},{"k":"ln","n":136,"t":"The instruments of darkness tell us truths,"},{"k":"ln","n":137,"t":"Win us with honest trifles, to betray ’s"},{"k":"ln","n":138,"t":"In deepest consequence.—"},{"k":"ln","n":139,"t":"Cousins, a word, I pray you."},{"k":"st","t":"They step aside.","key":"s139"},{"k":"sp","t":"Macbeth (aside)"},{"k":"ln","n":140,"t":"Two truths are told"},{"k":"ln","n":141,"t":"As happy prologues to the swelling act"},{"k":"ln","n":142,"t":"Of the imperial theme.—I thank you, gentlemen."},{"k":"ln","n":143,"t":"[Aside.] This supernatural soliciting"},{"k":"ln","n":144,"t":"Cannot be ill, cannot be good. If ill,"},{"k":"ln","n":145,"t":"Why hath it given me earnest of success"},{"k":"ln","n":146,"t":"Commencing in a truth? I am Thane of Cawdor."},{"k":"ln","n":147,"t":"If good, why do I yield to that suggestion"},{"k":"ln","n":148,"t":"Whose horrid image doth unfix my hair"},{"k":"ln","n":149,"t":"And make my seated heart knock at my ribs"},{"k":"ln","n":150,"t":"Against the use of nature? Present fears"},{"k":"ln","n":151,"t":"Are less than horrible imaginings."},{"k":"ln","n":152,"t":"My thought, whose murder yet is but fantastical,"},{"k":"ln","n":153,"t":"Shakes so my single state of man"},{"k":"ln","n":154,"t":"That function is smothered in surmise,"},{"k":"ln","n":155,"t":"And nothing is but what is not."},{"k":"sp","t":"Banquo"},{"k":"ln","n":156,"t":"Look how our partner’s rapt."},{"k":"sp","t":"Macbeth (aside)"},{"k":"ln","n":157,"t":"If chance will have me king, why, chance may"},{"k":"ln","n":158,"t":"crown me"},{"k":"ln","n":159,"t":"Without my stir."},{"k":"sp","t":"Banquo"},{"k":"ln","n":160,"t":"New honors come upon him,"},{"k":"ln","n":161,"t":"Like our strange garments, cleave not to their mold"},{"k":"ln","n":162,"t":"But with the aid of use."},{"k":"sp","t":"Macbeth (aside)"},{"k":"ln","n":163,"t":"Come what come may,"},{"k":"ln","n":164,"t":"Time and the hour runs through the roughest day."}],"notes":[{"id":"n5-1","from":128,"to":131,"title":"Macbeth tests Banquo","meaning":"Macbeth asks Banquo whether he hopes his children will be kings, now that the Cawdor part has come true.","effect":"Macbeth is sounding Banquo out: is he tempted too? His mind is fixed on the prophecies.","tags":["banquo","ambition"]},{"id":"n5-2","from":132,"to":133,"title":"Banquo sees the danger","meaning":"‘Trusted home’ means fully believed. Banquo says that if Macbeth completely believes it, it might ‘enkindle’ (set on fire) his hopes of the crown.","effect":"Banquo spots the danger in Macbeth’s thinking. He is the first character to warn that the prophecy could ignite ambition.","ask":"How does the word ‘enkindle’ suggest ambition?","tags":["banquo","ambition","key13"],"support":"‘Enkindle’ means ___. Banquo warns the prophecy could ___ Macbeth’s ___.","stretch":"What does the image of fire suggest about how ambition spreads?","revise":true},{"id":"n5-3","from":135,"to":138,"title":"Banquo’s warning","meaning":"Evil forces (‘instruments of darkness’) might tell us small truths (‘honest trifles’) to win our trust, and then trap us with a disaster.","effect":"Banquo is wise: he knows evil can tell partial truths. Macbeth doesn’t listen. A perfect quote for comparing them: one warns, one is tempted.","ask":"How does Banquo’s attitude differ from Macbeth’s?","tags":["banquo","fate","key13"],"support":"Banquo warns that evil may tell ___ truths to ___ us. This matters because ___.","stretch":"‘Honest trifles’ is a paradox. How does it capture the danger Banquo describes?","revise":true},{"id":"n5-4","from":140,"to":142,"title":"A play in his mind","meaning":"Macbeth says two truths are ‘happy prologues’ (openings) to a big drama (‘swelling act’) about being king (‘the imperial theme’).","effect":"He describes his life as a play with a grand ending. He is already imagining himself as king. Note the theatre metaphor and the confidence.","tags":["ambition","language","key13"],"support":"Macbeth calls the prophecies ‘happy prologues’. A prologue is ___, so he thinks ___.","stretch":"Why might a character compare his life to a play? Who is ‘watching’?"},{"id":"n5-5","at":143,"phrase":"supernatural soliciting","title":"Word to know: soliciting","meaning":"‘Soliciting’ means urging or tempting. The prophecy is a supernatural pull.","effect":"Macbeth calls it a ‘soliciting’: a temptation from outside. He feels pushed, but the thoughts that follow are his own.","tags":["language","fate"]},{"id":"n5-6","at":144,"phrase":"Cannot be ill, cannot be good","title":"Torn in two","meaning":"It can’t be evil, and it can’t be good.","effect":"A paradox again, echoing ‘fair is foul’. Macbeth’s mind is divided between wanting to believe and being uneasy. Notice how he argues both sides.","ask":"Why is Macbeth so keen to work out whether it is good or ill?","tags":["language","appearance","key13"],"support":"Macbeth says it ‘cannot be ill, cannot be good’, so he is ___ (certain or unsure).","stretch":"Why does Macbeth need to decide whether the witches are good or evil? What does he want the answer to be?","revise":true},{"id":"n5-7","from":145,"to":146,"title":"Macbeth’s logic","meaning":"If it is evil, why did it start by giving me a real truth (Cawdor)?","effect":"He talks himself into trusting the witches. The reasoning is shaky because he wants to believe. And he uses ‘earnest’, Ross’s word, again.","tags":["ambition","key13"],"support":"Macbeth reasons: if the witches are evil, why ___? This shows he wants to ___.","stretch":"Compare Macbeth’s reasoning with Banquo’s. Whose would you trust more?"},{"id":"n5-8","from":147,"to":151,"title":"The horrid image","meaning":"If it is good, why does the thought scare him so much? His hair stands on end and his heart pounds. ‘Present fears are less than horrible imaginings’: what he imagines is worse than real danger.","effect":"The ‘horrid image’ is almost certainly killing Duncan. His body reacts before he says it. He is scared by his own mind.","ask":"What do you think the horrid image is? Which words suggest it?","tags":["ambition","language","key13"],"support":"The ‘horrid image’ makes his ___ and ___ react. This shows he is ___.","stretch":"Macbeth is frightened by something he has only imagined. What does this suggest about imagination and guilt?","revise":true},{"id":"n5-9","at":152,"phrase":"whose murder yet is but fantastical","title":"Murder enters his mind","meaning":"‘Fantastical’ means existing only in the imagination. His murder thought is only in his head.","effect":"Murder has entered Macbeth’s thoughts before he has done or said anything. Shakespeare shows how quickly ambition turns dark.","tags":["ambition","key13"],"support":"Macbeth thinks of ‘murder’ but calls it ‘fantastical’ (___). So he has not ___ yet.","stretch":"How does Shakespeare show ambition turning dark using only Macbeth’s thoughts?","revise":true},{"id":"n5-10","from":153,"to":155,"title":"Thought overpowers action","meaning":"His imagining shakes his whole self and smothers his ability to act normally. The only thing that feels real is what is not real yet.","effect":"‘Nothing is but what is not’ is another paradox, echoing ‘fair is foul’. Reality and imagination are swapping places.","tags":["language","appearance","key13"],"support":"His thoughts ‘smother’ his ability to ___. ‘Nothing is but what is not’ means ___.","stretch":"How does this paradox echo ‘fair is foul’? What connection is Shakespeare drawing?","revise":true},{"id":"n5-11","at":156,"phrase":"rapt","title":"Banquo watches","meaning":"‘Rapt’ means completely absorbed, in a trance.","effect":"Banquo notices Macbeth’s odd behaviour but gives an innocent reason. He trusts Macbeth even while he distrusts the witches.","tags":["banquo"]},{"id":"n5-12","from":157,"to":159,"title":"Leave it to chance","meaning":"If fate wants me to be king, fate can crown me without my doing anything.","effect":"Macbeth considers waiting passively. Later, Lady Macbeth will push him to act. Compare this with ‘Disdaining Fortune’ in 1.2, and notice how his attitude to chance has changed.","ask":"Is Macbeth choosing to trust fate, or avoiding a choice?","tags":["ambition","fate","key13","ahead"],"support":"Macbeth says ‘chance may crown me without my stir’, so he thinks he could ___.","stretch":"Compare ‘Disdaining Fortune’ (1.2) with ‘chance may crown me’ (1.3). What has changed?","revise":true},{"id":"n5-13","from":160,"to":162,"title":"Banquo’s innocent excuse","meaning":"New clothes don’t fit until you have worn them in, and Banquo says Macbeth’s new honours feel the same.","effect":"Clothing imagery again (‘borrowed robes’ and ‘strange garments’). Banquo makes a kind excuse for his friend, with no idea that Macbeth is thinking of murder.","tags":["banquo","language","key13"],"support":"Banquo compares Macbeth’s honours to new ___. He thinks Macbeth is behaving strangely because ___.","stretch":"Banquo gives an innocent reason. What does the audience know that Banquo does not?","revise":true},{"id":"n5-14","from":163,"to":164,"title":"Come what come may","meaning":"Whatever happens will happen. Time keeps passing, even through the worst days.","effect":"Macbeth calms himself by deciding to leave it to time. But his thoughts have already gone to murder, and he cannot un-think them. He is about to hide his real thoughts from Banquo.","tags":["ambition","fate","key13"],"support":"‘Come what come may’ shows Macbeth is trying to ___.","stretch":"Does Macbeth truly accept fate here, or is he avoiding a decision? Use evidence."}],"scene":"1.3","thinkSecs":120,"think":"With a partner (2 minutes): find the line where Macbeth first sounds frightened. Underline it, then tap to check.","taskSupport":"Highlight ‘horrid image’ and ‘murder’. Finish: ‘Macbeth is frightened because …’","taskStretch":"Choose one word from Macbeth’s aside and explain what it tells us about his thoughts.","gloss":[["enkindle","set on fire"],["trifles","small things"],["soliciting","tempting, urging"],["surmise","guessing, imagining"],["fantastical","only in the imagination"],["rapt","absorbed, in a trance"],["cleave","stick"],["mold","shape"]]},{"type":"link","key":"l5","short":"What next","mins":5,"title":"What happens next","text":"Macbeth is torn. He is thrilled by the idea of becoming king, but also {{terrified}} by the ‘horrid image’ of murder in his mind. He decides that if fate wants him to be king, it can crown him ‘without my {{stir}}’. Banquo thinks his friend is simply overwhelmed by his new {{titles}}. Snapping back to the group, Macbeth makes an {{excuse}}: his brain was busy with ‘things {{forgotten}}’, which is not the truth. He and Banquo agree to talk again ‘at more {{time}}’. Macbeth is now keeping {{secrets}} from his closest friend, which is a big step in his change.","track":"Tracker: add Macbeth’s ‘horrid image’ and Banquo’s ‘instruments of darkness’ warning to your grids.","ext":"Why is lying to Banquo a big step in Macbeth’s change?"},{"type":"plenary","key":"h2-end","short":"Exit","mins":7,"title":"Exit ticket","ticket":[{"lvl":"core","q":"What warning does Banquo give Macbeth?","a":"Evil forces may tell us small truths to win our trust, and then betray us (‘instruments of darkness’, ‘honest trifles’)."},{"lvl":"core","q":"What do you think Macbeth’s ‘horrid image’ is?","a":"Murdering King Duncan. He says ‘murder’ two lines later, and his body reacts with fear."},{"lvl":"stretch","q":"How has Macbeth’s attitude to fate changed since Act 1 Scene 2 (‘Disdaining Fortune’)?","a":"At first he trusted his own sword and ignored luck. Now he is ready to let chance work for him (‘If chance will have me king, why, chance may crown me / Without my stir’)."}],"next":"Next lesson: we practise the question types for a comprehension on Act 1 Scene 3."}],"aims":{"li":"To understand how Macbeth’s thoughts change when the first prophecy comes true, and how Banquo’s response is different.","sc":["I can explain what Banquo’s warning about the ‘instruments of darkness’ means.","I can explain what Macbeth’s ‘horrid image’ suggests about his thoughts.","I can use a short quotation to support a point about Macbeth’s ambition."],"stretch":"I can explain how Macbeth’s attitude to fate has changed since Act 1 Scene 2.","word":{"w":"aside","m":"words a character says that the audience hears but the other characters do not.","eg":"Macbeth’s private thoughts in this scene are asides. Use the word in one sentence today."},"bridge":"Last lesson: the witches met Macbeth and Banquo on the heath and made prophecies. Then they vanished, leaving the two men to argue about what they had seen.","bigger":["Now: collect evidence in your tracker","Lesson 4: comprehension on Act 1 Scene 3","A paragraph on Lady Macbeth","An essay on Macbeth’s ambition and how he changes, compared with Banquo and Macduff"]}}],"QUIZ":[{"q":"Where do the witches plan to meet Macbeth?","opts":["In a castle","Upon the heath","At the battlefield","In Duncan’s court"],"correct":1,"why":"‘Upon the heath’ (1.1)."},{"q":"What does ‘Fair is foul, and foul is fair’ suggest?","opts":["The weather is bad","Things are not what they seem","Macbeth is a fair man","The witches are fair"],"correct":1,"why":"It is a paradox: good and bad swap places, so appearances cannot be trusted."},{"q":"How does the Captain present Macbeth in 1.2?","opts":["Cowardly","Brave and loyal","Cruel to the king","Unsure of himself"],"correct":1,"why":"‘Brave Macbeth (well he deserves that name)’: this is the ‘before’ picture of Macbeth."},{"q":"Who tells Macbeth that he is now Thane of Cawdor?","opts":["The witches","Banquo","Ross and Angus","Duncan himself"],"correct":2,"why":"Ross and Angus bring the king’s message."},{"q":"What do the witches predict for Banquo?","opts":["He will be king","His children will be kings","He will die soon","He will be Thane of Cawdor"],"correct":1,"why":"‘Thou shalt get kings, though thou be none.’"},{"q":"How does Banquo react to the prophecies compared with Macbeth?","opts":["More suspicious and cautious","More excited","Exactly the same","More angry"],"correct":0,"why":"Banquo questions the witches and warns Macbeth. Macbeth wants to hear more."},{"q":"Banquo warns that ‘the instruments of darkness tell us truths’. What is he warning about?","opts":["Evil can tell small truths to trap us","Darkness is dangerous","Truth is always good","The witches lie about everything"],"correct":0,"why":"Small truths (‘honest trifles’) can win our trust before a terrible betrayal."},{"q":"What is the ‘horrid image’ that frightens Macbeth most likely to be?","opts":["Losing a battle","Murdering Duncan","Meeting the witches again","Banquo’s ghost"],"correct":1,"why":"Two lines later he says ‘murder’: the thought is only in his head, but it terrifies him."},{"q":"What does ‘rapt’ mean in ‘Look how our partner’s rapt’?","opts":["Angry","Absorbed in thought","Ill","Tired"],"correct":1,"why":"Banquo sees Macbeth lost in his own thoughts."},{"q":"Which line shows Macbeth is ready to leave the crown t const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<i class="sd">[$1]</i>');
const SHORT = { ambition: "Ambition", banquo: "Banquo", fate: "Fate", language: "Language", appearance: "Appearance", context: "Context", ahead: "Look ahead", key13: "★ 1.3 evidence" };

/* ratings are the only thing kept on the device, and only if the browser allows it */
const RKEY = "macbeth-act1-ratings";
function loadRate() { try { return JSON.parse(localStorage.getItem(RKEY) || "{}"); } catch (e) { return {}; } }
function saveRate() { try { localStorage.setItem(RKEY, JSON.stringify(S.rate)); } catch (e) { /* storage unavailable */ } }

const S = { view: "lesson", h: 0, s: 0, tag: "all", sel: null, scale: 1, rev: { tab: "quotes", tag: "all", quiz: null }, rate: loadRate() };
const cur = () => DATA.hours[S.h].steps[S.s];

/* order notes by position in the text */
DATA.hours.forEach((h) => h.steps.forEach((st) => {
  if (st.type !== "extract") return;
  const posOf = (n) => {
    let i;
    if (n.stage) i = st.lines.findIndex((l) => l.k === "st" && l.key === n.stage);
    else { const ln = n.at !== undefined ? n.at : n.from; i = st.lines.findIndex((l) => l.k === "ln" && l.n === ln); }
    return i * 1000 + (n.phrase && !n.stage ? Math.max(0, (st.lines[i].t || "").indexOf(n.phrase)) : 0);
  };
  st.notes.forEach((n) => (n._pos = posOf(n)));
  st.notes.sort((a, b) => a._pos - b._pos);
}));

const tagOK = (n, tag) => tag === "all" || n.tags.includes(tag);
const match = (n) => tagOK(n, S.tag);
const visible = (st) => st.notes.filter(match);
const byId = (st, id) => st.notes.find((n) => n.id === id);

/* ---------- top bar and navigation ---------- */
function renderTop() {
  $("#hours").innerHTML = DATA.hours.map((h, i) =>
    `<button class="seg${S.view === "lesson" && i === S.h ? " on" : ""}" data-h="${i}"><b>${esc(h.title)}</b><small>${esc(h.subtitle)}</small></button>`).join("") +
    `<button class="seg${S.view === "revise" ? " on" : ""}" data-view="revise"><b>Revise</b><small>Practise at home</small></button>`;
}
function renderNav() {
  const nav = $("#nav");
  if (S.view !== "lesson") { nav.hidden = true; return; }
  nav.hidden = false;
  const h = DATA.hours[S.h];
  const first = S.h === 0 && S.s === 0;
  const last = S.h === DATA.hours.length - 1 && S.s === h.steps.length - 1;
  const nextLabel = S.s === h.steps.length - 1 && !last ? "Next lesson ▶" : "Next ▶";
  const prevLabel = S.s === 0 && !first ? "◀ Last lesson" : "◀ Back";
  nav.innerHTML =
    `<button class="btn" data-act="prev" ${first ? "disabled" : ""}>${prevLabel}</button>` +
    `<div class="pills">` + h.steps.map((s, i) =>
      `<button class="pill ${s.type}${i === S.s ? " on" : ""}" data-s="${i}" title="About ${s.mins} min"><span class="pn">${i + 1}</span>${esc(s.short)}</button>`).join("") + `</div>` +
    `<button class="btn primary" data-act="next" ${last ? "disabled" : ""}>${nextLabel}</button>`;
}
function chipRow(notes, active) {
  const counts = {};
  notes.forEach((n) => n.tags.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  return `<span class="fl">Show notes about</span><button class="chip${active === "all" ? " on" : ""}" data-tag="all">All (${notes.length})</button>` +
    Object.keys(DATA.TAGS).filter((t) => counts[t]).map((t) =>
      `<button class="chip tg-${t}${active === t ? " on" : ""}" data-tag="${t}"><i class="dot"></i>${esc(SHORT[t])} (${counts[t]})</button>`).join("");
}
function renderFilters() {
  const el = $("#filters");
  if (S.view === "revise") { el.hidden = true; return; }
  const st = cur();
  if (st.type !== "extract") { el.hidden = true; return; }
  el.hidden = false;
  const has = new Set(); st.notes.forEach((n) => n.tags.forEach((t) => has.add(t)));
  if (S.tag !== "all" && !has.has(S.tag)) S.tag = "all";
  el.innerHTML = chipRow(st.notes, S.tag);
}

/* ---------- shared pieces ---------- */
function qaCards(qa) {
  return qa.map((q) => `<div class="qa ${q.lvl || ""}" role="button" tabindex="0" data-qa>${q.lvl ? `<span class="lv">${q.lvl === "core" ? "Core" : "Stretch"}</span>` : ""}<div class="qq">${esc(q.q)}</div><div class="aa">${esc(q.a)}</div></div>`).join("");
}
function ratingHTML(h) {
  const A = DATA.hours[h].aims;
  const items = [...A.sc, A.stretch];
  return items.map((t, i) => {
    const v = S.rate[h + ":" + i];
    return `<div class="rate"><p>${i === A.sc.length ? "<b>Stretch:</b> " : ""}${esc(t)}</p><div class="rbtns">` +
      ["Not yet", "Nearly", "Got it"].map((l, k) => `<button class="rb${v === k ? " on" : ""}" data-rate="${h}:${i}:${k}">${l}</button>`).join("") + `</div></div>`;
  }).join("");
}
function clozeParts(text) {
  let i = 0;
  const html = esc(text).replace(/\{\{(.+?)\}\}/g, (m, a) => { i++; return `<span class="gap" data-gap role="button" tabindex="0"><sup>${i}</sup><span class="ans">${esc(a)}</span></span>`; });
  const bank = [...text.matchAll(/\{\{(.+?)\}\}/g)].map((m) => m[1]).sort((a, b) => a.localeCompare(b));
  return { html, bank };
}
function hingeHTML(hg) {
  return `<div class="hinge"><div class="lab">Quick check: vote, then reveal</div><p class="hq">${esc(hg.q)}</p>` +
    hg.opts.map((o, i) => `<button class="opt" data-hinge="${i}">${"ABCD"[i]}&nbsp; ${esc(o)}</button>`).join("") +
    `<div class="row"><button class="ghost small" data-act="hingeshow">Show answer</button></div><div class="hres" hidden></div></div>`;
}

function contextHTML(st) {
  const side = st.side;
  return `<section class="pane script"><div class="head"><span class="kick">About ${st.mins} min</span><h2>${esc(st.title)}</h2><p class="sub">${esc(st.lead)}</p></div>` +
    st.blocks.map((b) => `<div class="fact card" role="button" tabindex="0" data-reveal><h3>${esc(b.h)}</h3><p class="prompt">${esc(b.prompt || "")}</p><p class="txt">${esc(b.t)}</p><span class="tap">Talk first, then tap to check</span></div>`).join("") + `</section>` +
    `<aside class="pane side"><h3>${esc(side.title)}</h3>${side.items.map((i) => `<div class="idea"><b>${esc(i.h)}</b><p>${esc(i.t)}</p></div>`).join("")}</aside>`;

function annSpans(text, notes) {
  const marks = [];
  notes.forEach((n) => { const i = text.indexOf(n.phrase); if (i >= 0) marks.push({ s: i, e: i + n.phrase.length, n }); });
  marks.sort((a, b) => a.s - b.s);
  let out = "", p = 0;
  marks.forEach((m) => {
    out += fmt(text.slice(p, m.s));
    out += `<span class="ann${match(m.n) ? "" : " dim"}" data-note="${m.n.id}" role="button" tabindex="0">${fmt(text.slice(m.s, m.e))}</span>`;
    p = m.e;
  });
  return out + fmt(text.slice(p));
}

function extractHTML(st) {
  const phr = {}, rng = {}, stg = {};
  st.notes.forEach((n) => {
    if (n.phrase) { if (n.stage) (stg[n.stage] = stg[n.stage] || []).push(n); else (phr[n.at] = phr[n.at] || []).push(n); }
    else for (let i = n.from; i <= n.to; i++) rng[i] = n;
  });
  const body = st.lines.map((l) => {
    if (l.k === "sp") return `<div class="sp">${esc(l.t)}</div>`;
    if (l.k === "gap") return `<div class="gapline">${fmt(l.t)}</div>`;
    if (l.k === "st") return `<div class="stg">${l.key && stg[l.key] ? annSpans(l.t, stg[l.key]) : fmt(l.t)}</div>`;
    const r = rng[l.n];
    const num = l.n % 5 === 0 ? l.n : "";
    if (r) return `<div class="ln rng${match(r) ? "" : " dim"}" data-note="${r.id}" role="button" tabindex="0"><span class="num">${num}</span><span class="tx">${fmt(l.t)}</span></div>`;
    return `<div class="ln"><span class="num">${num}</span><span class="tx">${annSpans(l.t, phr[l.n] || [])}</span></div>`;
  }).join("");
  return `<section class="pane script" id="script"><div class="head"><span class="kick">${esc(st.label)} · about ${st.mins} min</span><h2>${esc(st.title)}</h2><p class="sub">${esc(st.sub)}</p></div>${body}` +
    `<div class="foot">Text: Folger Shakespeare Library edition (folger.edu). Line numbers as printed there.</div></section>` +
    `<aside class="pane side" id="panel" aria-live="polite"></aside>`;
}

function idlePanel(st) {
  return `<h3>Set the scene</h3><p class="lead">${esc(st.setup)}</p>` +
    (st.think ? `<div class="think"><b>Think first</b><p>${esc(st.think)}</p><button class="ghost small" data-act="timer" data-sec="${st.thinkSecs || 30}">Start timer</button></div>` : "") +
    `<p class="hint">Then tap any underlined phrase or highlighted line to open its explanation. ${visible(st).length} notes showing.</p>` +
    `<button class="ghost" data-act="firstnote">Start with the first note</button>`;
}
function quoteOf(st, n) {
  if (n.phrase) return n.phrase;
  const ls = st.lines.filter((l) => l.k === "ln" && l.n >= n.from && l.n <= n.to).map((l) => l.t);
  return ls.length > 2 ? ls[0] + " … " + ls[ls.length - 1] : ls.join(" / ");
}
function notePanel(st, n) {
  const vis = visible(st), idx = vis.findIndex((x) => x.id === n.id);
  const tiers = (n.support || n.stretch)
    ? `<div class="tierbtns">${n.support ? `<button class="ghost small" data-act="tog" data-t="sup">Need a starter?</button>` : ""}${n.stretch ? `<button class="ghost small" data-act="tog" data-t="str">Push further</button>` : ""}</div>` +
      (n.support ? `<div class="tier sup" hidden><b>Sentence starter</b>${esc(n.support)}</div>` : "") +
      (n.stretch ? `<div class="tier str" hidden><b>Stretch question</b>${esc(n.stretch)}</div>` : "")
    : "";
  return `<div class="ptop"><span>Note ${idx + 1} of ${vis.length}</span><button class="mini" data-act="clear">Close ✕</button></div>` +
    `<p class="q">${fmt(quoteOf(st, n))}</p><h3>${esc(n.title)}</h3>` +
    `<div class="lab">In plain English</div><p>${esc(n.meaning)}</p>` +
    `<div class="lab">Why it matters</div><p>${esc(n.effect)}</p>` +
    (n.ask ? `<div class="ask"><b>Ask the class</b><p>${esc(n.ask)}</p></div>` : "") + tiers +
    `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div>` +
    `<div class="notenav"><button data-act="pn">◀ Previous note</button><button data-act="nn">Next note ▶</button></div>`;
}
function applySel() {
  const st = cur();
  document.querySelectorAll("[data-note]").forEach((el) => el.classList.toggle("on", el.dataset.note === S.sel));
  const panel = $("#panel");
  if (!panel) return;
  const n = S.sel && byId(st, S.sel);
  panel.innerHTML = n ? notePanel(st, n) : idlePanel(st);
  if (n) {
    const first = document.querySelector(`[data-note="${S.sel}"]`);
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (first) first.scrollIntoView({ block: "center", behavior: smooth ? "smooth" : "auto" });
  }
  panel.scrollTop = 0;
}
function select(id) { S.sel = id; applySel(); }
function stepNote(d) {
  const st = cur(), vis = visible(st);
  if (!vis.length) return;
  let i = vis.findIndex((n) => n.id === S.sel);
  i = i < 0 ? (d > 0 ? 0 : vis.length - 1) : (i + d + vis.length) % vis.length;
  select(vis[i].id);
}

function linkHTML(st) {
  const { html, bank } = clozeParts(st.text);
  return `<section class="pane script"><div class="head"><span class="kick">About ${st.mins} min</span><h2>${esc(st.title)}</h2><p class="sub">Read aloud and tap each gap to reveal the word.</p></div>` +
    `<p class="cloze">${html}</p>` +
    (st.ext ? `<p class="stretchsc" style="margin-top:1.2rem"><b>Stretch:</b> ${esc(st.ext)}</p>` : "") + `</section>` +
    `<aside class="pane side"><h3>Word bank</h3><div class="bank">${bank.map((a) => `<span>${esc(a)}</span>`).join("")}</div>` +
    `<div class="row"><button class="ghost" data-act="reveal">Reveal all</button></div>` +
    `<div class="track"><p>${esc(st.track)}</p></div>` + (st.hinge ? hingeHTML(st.hinge) : "") + `</aside>`;
}

function plenaryHTML(st) {
  return `<section class="pane script"><div class="head"><span class="kick">About ${st.mins} min</span><h2>${esc(st.title)}</h2><p class="sub">Answer on your handout first. Then tap a question to check.</p></div>${qaCards(st.ticket)}</section>` +

/* ---------- revise mode (for home) ---------- */
function reviseNotes() {
  const out = [];
  DATA.hours.forEach((h) => h.steps.filter((s) => s.type === "extract").forEach((st) => st.notes.filter((n) => n.revise).forEach((n) => out.push({ st, n }))));
  return out;
}
function refText(st, n) {
  const ln = n.at !== undefined ? `line ${n.at}` : n.from !== undefined ? (n.from === n.to ? `line ${n.from}` : `lines ${n.from}–${n.to}`) : "";
  return `Act 1 Scene ${st.scene.split(".")[1]}${ln ? ", " + ln : ""}`;
}
function reviseHTML() {
  const tabs = [["quotes", "Key quotes"], ["quiz", "Quick quiz"], ["gaps", "Gap-fills"], ["ready", "Am I ready?"]];
  const head = `<div class="head"><h2>Revise Act 1</h2><p class="intro">Try to answer before you reveal. Nothing here is marked, so mistakes are useful.</p></div>` +
    `<nav class="tabs" aria-label="Revision sections">${tabs.map(([k, l]) => `<button class="tab${S.rev.tab === k ? " on" : ""}" data-tab="${k}">${l}</button>`).join("")}</nav>`;
  let body = "";
  if (S.rev.tab === "quotes") {
    const all = reviseNotes();
    const cards = all.filter(({ n }) => tagOK(n, S.rev.tag));
    body = `<div class="filters" style="padding-left:0;border:0">${chipRow(all.map((x) => x.n), S.rev.tag)}</div><p class="intro">Read the quotation. Say what it shows about Macbeth or Banquo. Then tap to check.</p>` +
      `<div class="qgrid">${cards.map(({ st, n }) => `<div class="qcard" role="button" tabindex="0" data-qcard><p class="qt">${fmt(quoteOf(st, n))}</p><p class="qr">${esc(refText(st, n))}</p>` +
        `<div class="qb"><p><b>${esc(n.title)}.</b> ${esc(n.meaning)}</p><p>${esc(n.effect)}</p>${n.support ? `<p><b>Sentence starter:</b> ${esc(n.support)}</p>` : ""}${n.stretch ? `<p><b>Stretch:</b> ${esc(n.stretch)}</p>` : ""}` +
        `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div></div></div>`).join("")}</div>`;
  } else if (S.rev.tab === "quiz") {
    body = quizHTML();
  } else if (S.rev.tab === "gaps") {
    let n = 0;
    DATA.hours.forEach((h) => { let last = null; h.steps.forEach((st) => {
      if (st.type === "extract") last = st;
      if (st.type === "link") {
        n++;
        const { html, bank } = clozeParts(st.text);
        body += `<div class="gapcard"><h3>${esc(h.title)}: after ${esc(last ? last.title : "the start")}</h3><p class="cloze">${html}</p><div class="bank">${bank.map((a) => `<span>${esc(a)}</span>`).join("")}</div>` +
          (st.ext ? `<p class="stretchsc"><b>Stretch:</b> ${esc(st.ext)}</p>` : "") + `<div class="row"><button class="ghost small" data-act="revealcard">Reveal all</button></div></div>`;
      }
    }); });
    body = `<p class="intro">Fill the gaps in your head or on paper. Then tap a gap to check it.</p>` + body;
  } else {
    body = `<p class="intro">Rate yourself against each success criterion. Your choices stay on this device only.</p>` +
      DATA.hours.map((h, i) => `<div class="gapcard"><h3>${esc(h.title)}</h3><p>${esc(h.aims.li)}</p><div id="ratings-${i}" class="ratings-h">${ratingHTML(i)}</div></div>`).join("");
  }
  return `<section class="pane wide revise">${head}${body}</section>`;
}
function quizHTML() {
  const Q = DATA.QUIZ;
  let z = S.rev.quiz;
  if (!z) return `<div class="qz"><h3>Quick quiz</h3><p class="intro">${Q.length} questions on Lessons 1 and 2. Pick an answer to see why.</p><button class="ghost primary" data-act="qstart">Start the quiz</button></div>`;
  if (z.done) return `<div class="qz"><h3>Finished</h3><p class="score">${z.score} out of ${Q.length}</p><p class="intro">${z.score === Q.length ? "Every question right. Try the stretch questions in Key quotes." : "Go back to Key quotes or Gap-fills for anything that surprised you, then try again."}</p><button class="ghost primary" data-act="qstart">Try again</button></div>`;
  const q = Q[z.order[z.i]];
  return `<div class="qz"><span class="qn">Question ${z.i + 1} of ${Q.length}</span><h3>${esc(q.q)}</h3>` +
    q.opts.map((o, i) => `<button class="opt${z.picked !== null ? (i === q.correct ? " right" : i === z.picked ? " wrong" : "") : ""}" data-qopt="${i}" ${z.picked !== null ? "disabled" : ""}>${"ABCD"[i]}&nbsp; ${esc(o)}</button>`).join("") +
    (z.picked !== null ? `<p class="why"><b>${z.picked === q.correct ? "Correct." : "Not quite."}</b> ${esc(q.why)}</p><button class="ghost primary" data-act="qnext">${z.i + 1 === Q.length ? "See my score" : "Next question"}</button>` : "") + `</div>`;
}
function qstart() {
  const order = DATA.QUIZ.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  S.rev.quiz = { order, i: 0, score: 0, picked: null, done: false };
}

/* ---------- navigation ---------- */
function renderAll() { renderTop(); renderFilters(); renderMain(); renderNav(); }
function go(h, s) { S.view = "lesson"; S.h = h; S.s = s; S.sel = null; renderAll(); }
function move(d) {
  let h = S.h, s = S.s + d;
  if (s < 0) { if (h === 0) return; h--; s = DATA.hours[h].steps.length - 1; }
  else if (s >= DATA.hours[h].steps.length) { if (h === DATA.hours.length - 1) return; h++; s = 0; }
  go(h, s);
}

/* ---------- timer ---------- */
const T = { id: null, end: 0 };
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function timerStart(sec) {
  clearInterval(T.id);
  const el = $("#timer"); el.hidden = false; el.classList.remove("done");
  T.end = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
    $("#tt").textContent = left > 0 ? mmss(left) : "Time!";
    if (left <= 0) { clearInterval(T.id); el.classList.add("done"); }
  };
  tick(); T.id = setInterval(tick, 250);
}
function timerStop() { clearInterval(T.id); $("#timer").hidden = true; }

/* ---------- events ---------- */
function syncReveal(scope) {
  const btn = (scope || document).querySelector('[data-act="reveal"],[data-act="revealcard"]');
  if (!btn) return;
  const gaps = [...(scope || document).querySelectorAll(".gap")];
  btn.textContent = gaps.length && gaps.every((g) => g.classList.contains("open")) ? "Hide all" : "Reveal all";
}
function hingeMark(box, hg, picked) {
  box.querySelectorAll(".opt").forEach((o, j) => { o.classList.toggle("right", j === hg.correct); o.classList.toggle("wrong", picked !== null && j === picked && j !== hg.correct); });
  const res = box.querySelector(".hres"); res.hidden = false;
  res.innerHTML = `<b>${picked === null ? "Answer:" : picked === hg.correct ? "Correct." : "Not quite."}</b> ${esc(hg.why)}`;
}
document.addEventListener("click", (e) => {
  const t = e.target;
  if (!t.closest("#tbtn,#tmenu")) $("#tmenu").hidden = true;
  const note = t.closest("[data-note]");
  if (note) { select(note.dataset.note); return; }
  const gap = t.closest("[data-gap]");
  if (gap) { gap.classList.toggle("open"); syncReveal(gap.closest(".gapcard") || document); return; }
  const qa = t.closest("[data-qa]");
  if (qa) { qa.classList.toggle("open"); return; }
  const fact = t.closest("[data-reveal]");
  if (fact) { fact.classList.toggle("open"); return; }
  const qc = t.closest("[data-qcard]");
  if (qc) { qc.classList.toggle("open"); return; }
  const hb = t.closest("[data-hinge]");
  if (hb) { hingeMark(hb.closest(".hinge"), cur().hinge, +hb.dataset.hinge); return; }
  const rate = t.closest("[data-rate]");
  if (rate) {
    const [h, i, v] = rate.dataset.rate.split(":");
    S.rate[h + ":" + i] = +v; saveRate();
    const box = rate.closest("#ratings, .ratings-h");
    if (box) box.innerHTML = ratingHTML(+h);
    return;
  }
  const qo = t.closest("[data-qopt]");
  if (qo) {
    const z = S.rev.quiz, q = DATA.QUIZ[z.order[z.i]];
    if (z.picked === null) { z.picked = +qo.dataset.qopt; if (z.picked === q.correct) z.score++; $("#stage").innerHTML = reviseHTML(); }
    return;
  }
  const b = t.closest("button");
  if (!b) return;
  if (b.closest("#tmenu")) { timerStart(+b.dataset.sec); $("#tmenu").hidden = true; return; }
  if (b.dataset.view === "revise") { S.view = "revise"; renderAll(); return; }
  if (b.dataset.h !== undefined) return go(+b.dataset.h, 0);
  if (b.dataset.s !== undefined) return go(S.h, +b.dataset.s);
  if (b.dataset.tab) { S.rev.tab = b.dataset.tab; $("#stage").innerHTML = reviseHTML(); return; }
  if (b.dataset.tag !== undefined) {
    if (S.view === "revise") { S.rev.tag = b.dataset.tag; $("#stage").innerHTML = reviseHTML(); return; }
    S.tag = b.dataset.tag;
    const st = cur();
    if (S.sel && !match(byId(st, S.sel))) S.sel = null;
    renderFilters();
    const keep = $("#script") ? $("#script").scrollTop : 0;
    $("#stage").innerHTML = extractHTML(st);
    applySel();
    if ($("#script")) $("#script").scrollTop = keep;
    return;
  }
  switch (b.dataset.act) {
    case "next": move(1); break;
    case "prev": move(-1); break;
    case "nn": stepNote(1); break;
    case "pn": stepNote(-1); break;
    case "firstnote": stepNote(1); break;
    case "clear": S.sel = null; applySel(); break;
    case "tog": { const el = $("#panel ." + b.dataset.t); if (el) { el.hidden = !el.hidden; if (!el.hidden) el.scrollIntoView({ block: "nearest" }); } break; }
    case "timer": timerStart(+b.dataset.sec); break;
    case "tstop": timerStop(); break;
    case "hingeshow": hingeMark(b.closest(".hinge"), cur().hinge, null); break;
    case "qstart": qstart(); $("#stage").innerHTML = reviseHTML(); break;
    case "qnext": { const z = S.rev.quiz; z.i++; z.picked = null; if (z.i >= DATA.QUIZ.length) z.done = true; $("#stage").innerHTML = reviseHTML(); break; }
    case "reveal": case "revealcard": {
      const scope = b.closest(".gapcard") || document;
      const gaps = scope.querySelectorAll(".gap");
      const allOpen = [...gaps].every((g) => g.classList.contains("open"));
      gaps.forEach((g) => g.classList.toggle("open", !allOpen));
      syncReveal(scope);
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")) { e.preventDefault(); e.target.click(); return; }
  if (e.target.matches("input,textarea") || S.view !== "lesson") return;
  if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "Escape" && S.sel) { S.sel = null; applySel(); }
  else if (e.key === "]") stepNote(1);
  else if (e.key === "[") stepNote(-1);
});

/* tools */
function setScale(d) {
  S.scale = Math.min(1.6, Math.max(0.75, +(S.scale + d).toFixed(2)));
  document.documentElement.style.setProperty("--scale", S.scale);
}
$("#fsm").addEventListener("click", () => setScale(-0.1));
$("#fsp").addEventListener("click", () => setScale(0.1));
$("#tbtn").addEventListener("click", () => { $("#tmenu").hidden = !$("#tmenu").hidden; });
function effectiveTheme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function syncTheme() { $("#theme").textContent = effectiveTheme() === "dark" ? "Day mode" : "Night mode"; }
$("#theme").addEventListener("click", () => { document.documentElement.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark"; syncTheme(); });
$("#full").addEventListener("click", () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) { /* not available */ }
});
syncTheme();
renderAll();
</script>
</body>
</html>
