ar their favours, whereas Macbeth demands more (‘Stay, you imperfect speakers. Tell me more.’)."}],"next":"Next lesson: Ross and Angus bring news that changes everything. Watch how quickly Macbeth’s thoughts change."}],"aims":{"li":"To understand how Shakespeare introduces Macbeth, the witches and Banquo, and to spot how the two men react differently.","sc":["I can explain what ‘fair is foul, and foul is fair’ tells us about the play.","I can describe how Macbeth is presented before he meets the witches, using a short quotation.","I can compare how Macbeth and Banquo react to the witches, giving evidence for each."],"stretch":"I can explain how a technique, such as paradox, makes a line more powerful.","word":{"w":"paradox","m":"a statement that seems to contradict itself but still holds a truth.","eg":"‘Fair is foul, and foul is fair.’ Use the word in one sentence today."},"bridge":""}},{"title":"Lesson 2","subtitle":"The rest of Scene 1.3","steps":[{"type":"aims","key":"h2-aims","short":"Aims","mins":6,"title":"Today’s lesson","doNow":{"title":"Do now: what do you remember?","qa":[{"q":"What three greetings do the witches give Macbeth?","a":"Thane of Glamis, Thane of Cawdor, and king hereafter."},{"q":"What do they promise Banquo?","a":"His children will be kings, though he will not be king himself."},{"q":"How do Macbeth and Banquo react differently to the witches?","a":"Macbeth is startled and wants more information. Banquo questions the witches and suspects he has been tricked."}]}},{"type":"extract","key":"e4","short":"1.3 News","mins":8,"label":"Extract 4","title":"Act 1, Scene 3: the king’s message","sub":"An extract","setup":"Ross and Angus arrive with a message from the king. Watch how quickly one prediction comes true, and how each man responds.","task":"Underline Banquo’s first reaction. What does it suggest he suspects?","lines":[{"k":"sp","t":"Ross"},{"k":"ln","n":109,"t":"And for an earnest of a greater honor,"},{"k":"ln","n":110,"t":"He bade me, from him, call thee Thane of Cawdor,"},{"k":"ln","n":111,"t":"In which addition, hail, most worthy thane,"},{"k":"ln","n":112,"t":"For it is thine."},{"k":"sp","t":"Banquo"},{"k":"ln","n":113,"t":"What, can the devil speak true?"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":114,"t":"The Thane of Cawdor lives. Why do you dress me"},{"k":"ln","n":115,"t":"In borrowed robes?"},{"k":"sp","t":"Angus"},{"k":"ln","n":116,"t":"Who was the Thane lives yet,"},{"k":"ln","n":117,"t":"But under heavy judgment bears that life"},{"k":"ln","n":118,"t":"Which he deserves to lose. Whether he was"},{"k":"gap","t":"[…]"},{"k":"ln","n":123,"t":"But treasons capital, confessed and proved,"},{"k":"ln","n":124,"t":"Have overthrown him."},{"k":"sp","t":"Macbeth (aside)"},{"k":"ln","n":125,"t":"Glamis and Thane of Cawdor!"},{"k":"ln","n":126,"t":"The greatest is behind. [To Ross and Angus.] Thanks"},{"k":"ln","n":127,"t":"for your pains."}],"notes":[{"id":"n4-1","at":109,"phrase":"an earnest of a greater honor","title":"A down-payment","meaning":"‘Earnest’ means a first payment, or a promise of more to come. Cawdor is only the start.","effect":"Duncan means more rewards will follow. To Macbeth, who has just been told ‘king hereafter’, ‘a greater honor’ could sound like a promise of the crown. Watch for ‘earnest’ in his next speech.","tags":["language","ambition","key13"],"support":"‘Earnest’ means ___. Macbeth may hear ‘a greater honor’ as ___.","stretch":"Ross means more rewards, but Macbeth may hear ‘the crown’. How can one phrase mean two things?"},{"id":"n4-2","at":111,"phrase":"hail, most worthy thane","title":"‘Hail’ again","meaning":"Ross uses the witches’ word ‘hail’.","effect":"The human world echoes the supernatural one, so the prophecy seems even more real.","tags":["fate","language"]},{"id":"n4-3","at":113,"phrase":"What, can the devil speak true?","title":"Banquo’s suspicion","meaning":"Banquo wonders aloud whether the devil can tell the truth.","effect":"Banquo’s first reaction to a prophecy coming true is suspicion. He guesses that evil could be at work. Macbeth’s reaction is to want more.","ask":"What does this line tell us about Banquo?","tags":["banquo","fate","key13"],"support":"Banquo suspects ___. He says this ___ (aloud or secretly), which shows ___.","stretch":"Banquo has the same information as Macbeth. Why do they draw different conclusions?","revise":true},{"id":"n4-4","from":114,"to":115,"title":"Borrowed robes","meaning":"Macbeth says the title belongs to someone else, like wearing borrowed clothes.","effect":"Clothing imagery returns again and again in the play, with titles that don’t fit. Here Macbeth objects honestly. Notice how quickly that changes.","tags":["language","ambition"]},{"id":"n4-5","at":123,"phrase":"treasons capital, confessed and proved,","title":"Treason means death","meaning":"‘Capital’ means punishable by death. Cawdor has confessed, so his punishment is certain.","effect":"Treason is the worst crime in this world. Macbeth is standing right next to a warning about it.","ask":"Why might Shakespeare remind us of the punishment for treason now?","tags":["ahead","ambition"]},{"id":"n4-6","at":125,"phrase":"Glamis and Thane of Cawdor!","title":"Two truths","meaning":"Two of the witches’ three greetings have now come true.","effect":"The first two were true, so the third suddenly seems believable. To Macbeth this is proof that the witches can predict the future.","tags":["fate","ambition"]},{"id":"n4-7","at":126,"phrase":"The greatest is behind.","title":"‘The greatest is behind’","meaning":"‘Behind’ means still to come. King is the greatest title, and it is still to come.","effect":"A few lines ago Macbeth said becoming king was beyond belief. Now he calls it the next step. This is a big shift in his thinking, so mark it in your tracker.","ask":"What has changed in his mind since line 77?","tags":["ambition","key13"],"support":"Earlier in 1.3 Macbeth says being king is ___. Now he says ‘The greatest is behind’, which means ___.","stretch":"How quickly does Macbeth’s view of becoming king change? Which words show the shift?","revise":true}],"scene":"1.3","thinkSecs":30,"think":"With a partner (30 seconds): what does Banquo think about the news? What does Macbeth think?","taskSupport":"Underline ‘What, can the devil speak true?’ Finish: ‘Banquo suspects …’","taskStretch":"Compare Banquo’s reaction with Macbeth’s ‘The greatest is behind.’ What does the contrast show?","gloss":[["earnest","a first payment, or promise of more"],["thane","a Scottish lord"],["addition","a title"],["capital (treasons)","punishable by death"],["behind","still to come"]]},{"type":"link","key":"l4","short":"What next","mins":4,"title":"What happens next","text":"Angus explains that the old Thane of Cawdor is a traitor who will be {{executed}}. Two of the witches’ predictions have now come true, so Macbeth’s mind jumps to the third: ‘The {{greatest}} is behind.’ He asks Banquo whether he hopes his {{children}} will be kings. Banquo replies with a {{warning}}. Evil forces may tell us small {{truths}} to win our trust, and then {{betray}} us when it matters most. Macbeth ignores this. He steps aside to speak his private thoughts in an {{aside}}, which the audience hears but the other characters do not.","track":"Tracker: add ‘The greatest is behind’ to the ambition grid. What has changed since 1.2?","hinge":{"q":"Banquo says ‘What, can the devil speak true?’ What is he suggesting?","opts":["That Macbeth is lying.","That the witches’ predictions might be an evil trick.","That he is jealous of Macbeth.","That he wants to be Thane of Cawdor."],"correct":1,"why":"Banquo is suspicious. If the witches can tell a truth, that might be a way of winning trust before something worse."},"ext":"Why might Banquo’s warning matter more to the audience than to Macbeth?"},{"type":"extract","key":"e5","short":"1.3 Aside","mins":25,"label":"Extract 5","title":"Act 1, Scene 3: Banquo’s warning and Macbeth’s aside","sub":"An extract","setup":"‘Aside’ means words the audience hears but the other characters don’t. Listen for how Macbeth reasons with himself, and how Banquo reacts.","task":"Highlight the moment Macbeth first imagines something terrible. What might he be picturing?","lines":[{"k":"sp","t":"Macbeth (aside to Banquo)"},{"k":"ln","n":128,"t":"Do you not hope your children"},{"k":"ln","n":129,"t":"shall be kings,"},{"k":"ln","n":130,"t":"When those that gave the Thane of Cawdor to me"},{"k":"ln","n":131,"t":"Promised no less to them?"},{"k":"sp","t":"Banquo"},{"k":"ln","n":132,"t":"That, trusted home,"},{"k":"ln","n":133,"t":"Might yet enkindle you unto the crown,"},{"k":"ln","n":134,"t":"Besides the Thane of Cawdor. But ’tis strange."},{"k":"ln","n":135,"t":"And oftentimes, to win us to our harm,"},{"k":"ln","n":136,"t":"The instruments of darkness tell us truths,"},{"k":"ln","n":137,"t":"Win us with honest trifles, to betray ’s"},{"k":"ln","n":138,"t":"In deepest consequence.—"},{"k":"ln","n":139,"t":"Cousins, a word, I pray you."},{"k":"st","t":"They step aside.","key":"s139"},{"k":"sp","t":"Macbeth (aside)"},{"k":"ln","n":140,"t":"Two truths are told"},{"k":"ln","n":141,"t":"As happy prologues to the swelling act"},{"k":"ln","n":142,"t":"Of the imperial theme.—I thank you, gentlemen."},{"k":"ln","n":143,"t":"[Aside.] This supernatural soliciting"},{"k":"ln","n":144,"t":"Cannot be ill, cannot be good. If ill,"},{"k":"ln","n":145,"t":"Why hath it given me earnest of success"},{"k":"ln","n":146,"t":"Commencing in a truth? I am Thane of Cawdor."},{"k":"ln","n":147,"t":"If good, why do I yield to that suggestion"},{"k":"ln","n":148,"t":"Whose horrid image doth unfix my hair"},{"k":"ln","n":149,"t":"And make my seated heart knock at my ribs"},{"k":"ln","n":150,"t":"Against the use of nature? Present fears"},{"k":"ln","n":151,"t":"Are less than horrible imaginings."},{"k":"ln","n":152,"t":"My thought, whose murder yet is but fantastical,"},{"k":"ln","n":153,"t":"Shakes so my single state of man"},{"k":"ln","n":154,"t":"That function is smothered in surmise,"},{"k":"ln","n":155,"t":"And nothing is but what is not."},{"k":"sp","t":"Banquo"},{"k":"ln","n":156,"t":"Look how our partner’s rapt."},{"k":"sp","t":"Macbeth (aside)"},{"k":"ln","n":157,"t":"If chance will have me king, why, chance may"},{"k":"ln","n":158,"t":"crown me"},{"k":"ln","n":159,"t":"Without my stir."},{"k":"sp","t":"Banquo"},{"k":"ln","n":160,"t":"New honors come upon him,"},{"k":"ln","n":161,"t":"Like our strange garments, cleave not to their mold"},{"k":"ln","n":162,"t":"But with the aid of use."},{"k":"sp","t":"Macbeth (aside)"},{"k":"ln","n":163,"t":"Come what come may,"},{"k":"ln","n":164,"t":"Time and the hour runs through the roughest day."}],"notes":[{"id":"n5-1","from":128,"to":131,"title":"Macbeth tests Banquo","meaning":"Macbeth asks Banquo whether he hopes his children will be kings, now that the Cawdor part has come true.","effect":"Macbeth is sounding Banquo out: is he tempted too? His mind is fixed on the prophecies.","tags":["banquo","ambition"]},{"id":"n5-2","from":132,"to":133,"title":"Banquo sees the danger","meaning":"‘Trusted home’ means fully believed. Banquo says that if Macbeth completely believes it, it might ‘enkindle’ (set on fire) his hopes of the crown.","effect":"Banquo spots the danger in Macbeth’s thinking. He is the first character to warn that the prophecy could ignite ambition.","ask":"How does the word ‘enkindle’ suggest ambition?","tags":["banquo","ambition","key13"],"support":"‘Enkindle’ means ___. Banquo warns the prophecy could ___ Macbeth’s ___.","stretch":"What does the image of fire suggest about how ambition spreads?","revise":true},{"id":"n5-3","from":135,"to":138,"title":"Banquo’s warning","meaning":"Evil forces (‘instruments of darkness’) might tell us small truths (‘honest trifles’) to win our trust, and then trap us with a disaster.","effect":"Banquo is wise: he knows evil can tell partial truths. Macbeth doesn’t listen. A perfect quote for comparing them: one warns, one is tempted.","ask":"How does Banquo’s attitude differ from Macbeth’s?","tags":["banquo","fate","key13"],"support":"Banquo warns that evil may tell ___ truths to ___ us. This matters because ___.","stretch":"‘Honest trifles’ is a paradox. How does it capture the danger Banquo describes?","revise":true},{"id":"n5-4","from":140,"to":142,"title":"A play in his mind","meaning":"Macbeth says two truths are ‘happy prologues’ (openings) to a big drama (‘swelling act’) about being king (‘the imperial theme’).","effect":"He describes his life as a play with a grand ending. He is already imagining himself as king. Note the theatre metaphor and the confidence.","tags":["ambition","language","key13"],"support":"Macbeth calls the prophecies ‘happy prologues’. A prologue is ___, so he thinks ___.","stretch":"Why might a character compare his life to a play? Who is ‘watching’?"},{"id":"n5-5","at":143,"phrase":"supernatural soliciting","title":"Word to know: soliciting","meaning":"‘Soliciting’ means urging or tempting. The prophecy is a supernatural pull.","effect":"Macbeth calls it a ‘soliciting’: a temptation from outside. He feels pushed, but the thoughts that follow are his own.","tags":["language","fate"]},{"id":"n5-6","at":144,"phrase":"Cannot be ill, cannot be good","title":"Torn in two","meaning":"It can’t be evil, and it can’t be good.","effect":"A paradox again, echoing ‘fair is foul’. Macbeth’s mind is divided between wanting to believe and being uneasy. Notice how he argues both sides.","ask":"Why is Macbeth so keen to work out whether it is good or ill?","tags":["language","appearance","key13"],"support":"Macbeth says it ‘cannot be ill, cannot be good’, so he is ___ (certain or unsure).","stretch":"Why does Macbeth need to decide whether the witches are good or evil? What does he want the answer to be?","revise":true},{"id":"n5-7","from":145,"to":146,"title":"Macbeth’s logic","meaning":"If it is evil, why did it start by giving me a real truth (Cawdor)?","effect":"He talks himself into trusting the witches. The reasoning is shaky because he wants to believe. And he uses ‘earnest’, Ross’s word, again.","tags":["ambition","key13"],"support":"Macbeth reasons: if the witches are evil, why ___? This shows he wants to ___.","stretch":"Compare Macbeth’s reasoning with Banquo’s. Whose would you trust more?"},{"id":"n5-8","from":147,"to":151,"title":"The horrid image","meaning":"If it is good, why does the thought scare him so much? His hair stands on end and his heart pounds. ‘Present fears are less than horrible imaginings’: what he imagines is worse than real danger.","effect":"The ‘horrid image’ is almost certainly killing Duncan. His body reacts before he says it. He is scared by his own mind.","ask":"What do you think the horrid image is? Which words suggest it?","tags":["ambition","language","key13"],"support":"The ‘horrid image’ makes his ___ and ___ react. This shows he is ___.","stretch":"Macbeth is frightened by something he has only imagined. What does this suggest about imagination and guilt?","revise":true},{"id":"n5-9","at":152,"phrase":"whose murder yet is but fantastical","title":"Murder enters his mind","meaning":"‘Fantastical’ means existing only in the imagination. His murder thought is only in his head.","effect":"Murder has entered Macbeth’s thoughts before he has done or said anything. Shakespeare shows how quickly ambition turns dark.","tags":["ambition","key13"],"support":"Macbeth thinks of ‘murder’ but calls it ‘fantastical’ (___). So he has not ___ yet.","stretch":"How does Shakespeare show ambition turning dark using only Macbeth’s thoughts?","revise":true},{"id":"n5-10","from":153,"to":155,"title":"Thought overpowers action","meaning":"His imagining shakes his whole self and smothers his ability to act normally. The only thing that feels real is what is not real yet.","effect":"‘Nothing is but what is not’ is another paradox, echoing ‘fair is foul’. Reality and imagination are swapping places.","tags":["language","appearance","key13"],"support":"His thoughts ‘smother’ his ability to ___. ‘Nothing is but what is not’ means ___.","stretch":"How does this paradox echo ‘fair is foul’? What connection is Shakespeare drawing?","revise":true},{"id":"n5-11","at":156,"phrase":"rapt","title":"Banquo watches","meaning":"‘Rapt’ means completely absorbed, in a trance.","effect":"Banquo notices Macbeth’s odd behaviour but gives an innocent reason. He trusts Macbeth even while he distrusts the witches.","tags":["banquo"]},{"id":"n5-12","from":157,"to":159,"title":"Leave it to chance","meaning":"If fate wants me to be king, fate can crown me without my doing anything.","effect":"Macbeth considers waiting passively. Later, Lady Macbeth will push him to act. Compare this with ‘Disdaining Fortune’ in 1.2, and notice how his attitude to chance has changed.","ask":"Is Macbeth choosing to trust fate, or avoiding a choice?","tags":["ambition","fate","key13","ahead"],"support":"Macbeth says ‘chance may crown me without my stir’, so he thinks he could ___.","stretch":"Compare ‘Disdaining Fortune’ (1.2) with ‘chance may crown me’ (1.3). What has changed?","revise":true},{"id":"n5-13","from":160,"to":162,"title":"Banquo’s innocent excuse","meaning":"New clothes don’t fit until you have worn them in, and Banquo says Macbeth’s new honours feel the same.","effect":"Clothing imagery again (‘borrowed robes’ and ‘strange garments’). Banquo makes a kind excuse for his friend, with no idea that Macbeth is thinking of murder.","tags":["banquo","language","key13"],"support":"Banquo compares Macbeth’s honours to new ___. He thinks Macbeth is behaving strangely because ___.","stretch":"Banquo gives an innocent reason. What does the audience know that Banquo does not?","revise":true},{"id":"n5-14","from":163,"to":164,"title":"Come what come may","meaning":"Whatever happens will happen. Time keeps passing, even through the worst days.","effect":"Macbeth calms himself by deciding to leave it to time. But his thoughts have already gone to murder, and he cannot un-think them. He is about to hide his real thoughts from Banquo.","tags":["ambition","fate","key13"],"support":"‘Come what come may’ shows Macbeth is trying to ___.","stretch":"Does Macbeth truly accept fate here, or is he avoiding a decision? Use evidence."}],"scene":"1.3","thinkSecs":120,"think":"With a partner (2 minutes): find the line where Macbeth first sounds frightened. Underline it, then tap to check.","taskSupport":"Highlight ‘horrid image’ and ‘murder’. Finish: ‘Macbeth is frightened because …’","taskStretch":"Choose one word from Macbeth’s aside and explain what it tells us about his thoughts.","gloss":[["enkindle","set on fire"],["trifles","small things"],["soliciting","tempting, urging"],["surmise","guessing, imagining"],["fantastical","only in the imagination"],["rapt","absorbed, in a trance"],["cleave","stick"],["mold","shape"]]},{"type":"link","key":"l5","short":"What next","mins":5,"title":"What happens next","text":"Macbeth is torn. He is thrilled by the idea of becoming king, but also {{terrified}} by the ‘horrid image’ of murder in his mind. He decides that if fate wants him to be king, it can crown him ‘without my {{stir}}’. Banquo thinks his friend is simply overwhelmed by his new {{titles}}. Snapping back to the group, Macbeth makes an {{excuse}}: his brain was busy with ‘things {{forgotten}}’, which is not the truth. He and Banquo agree to talk again ‘at more {{time}}’. Macbeth is now keeping {{secrets}} from his closest friend, which is a big step in his change.","track":"Tracker: add Macbeth’s ‘horrid image’ and Banquo’s ‘instruments of darkness’ warning to your grids.","ext":"Why is lying to Banquo a big step in Macbeth’s change?"},{"type":"plenary","key":"h2-end","short":"Exit","mins":7,"title":"Exit ticket","ticket":[{"lvl":"core","q":"What warning does Banquo give Macbeth?","a":"Evil forces may tell us small truths to win our trust, and then betray us (‘instruments of darkness’, ‘honest trifles’)."},{"lvl":"core","q":"What do you think Macbeth’s ‘horrid image’ is?","a":"Murdering King Duncan. He says ‘murder’ two lines later, and his body reacts with fear."},{"lvl":"stretch","q":"How has Macbeth’s attitude to fate changed since Act 1 Scene 2 (‘Disdaining Fortune’)?","a":"At first he trusted his own sword and ignored luck. Now he is ready to let chance work for him (‘If chance will have me king, why, chance may crown me / Without my stir’)."}],"next":"Next lesson: we practise the question types for a comprehension on Act 1 Scene 3."}],"aims":{"li":"To understand how Macbeth’s thoughts change when the first prophecy comes true, and how Banquo’s response is different.","sc":["I can explain what Banquo’s warning about the ‘instruments of darkness’ means.","I can explain what Macbeth’s ‘horrid image’ suggests about his thoughts.","I can use a short quotation to support a point about Macbeth’s ambition."],"stretch":"I can explain how Macbeth’s attitude to fate has changed since Act 1 Scene 2.","word":{"w":"aside","m":"words a character says that the audience hears but the other characters do not.","eg":"Macbeth’s private thoughts in this scene are asides. Use the word in one sentence today."},"bridge":"Last lesson: the witches met Macbeth and Banquo on the heath and made prophecies. Then they vanished, leaving the two men to argue about what they had seen."}},{"title":"Lesson 3","subtitle":"Comprehension skills, Scene 1.3","aims":{"li":"To practise answering comprehension questions on Act 1 Scene 3, and to know how each type of question earns marks.","sc":["I can choose the right answer in multiple-choice, true or false and matching questions by checking the text.","I can write a short answer that gives exactly what the question asks for, using line numbers.","I can compare Macbeth and Banquo, saying something about each man and backing it up."],"stretch":"I can explain what a quotation suggests about Macbeth’s character.","word":{"w":"infer","m":"to work out something the writer hints at but does not say directly.","eg":"Banquo says Macbeth ‘starts’, so we infer he is afraid. Use the word in one sentence today."},"bridge":"Last lesson: Ross and Angus brought news, Banquo warned Macbeth, and Macbeth’s private thoughts turned to murder."},"steps":[{"type":"aims","key":"h3-aims","short":"Aims","mins":6,"title":"Today’s lesson","doNow":{"title":"Do now: what do you remember?","qa":[{"q":"What did Banquo warn Macbeth about?","a":"That evil forces (‘the instruments of darkness’) may tell us small truths to win our trust, then betray us."},{"q":"What do you think Macbeth’s ‘horrid image’ is?","a":"Murdering King Duncan."},{"q":"What does Macbeth say when he decides to leave it to fate?","a":"‘If chance will have me king, why, chance may crown me / Without my stir.’"}]}},{"type":"context","key":"h3-types","short":"Questions","mins":8,"title":"How the questions work","lead":"Talk first, then tap a card to check your idea.","blocks":[{"h":"Multiple choice","prompt":"How can you find the right answer when all four options look sensible?","t":"Decide your own answer first, then look for it in the options. Cross out any option you know is wrong. Check the line numbers in the question."},{"h":"True or false","prompt":"What should you do if a statement is only partly true?","t":"Find the line it is about. If any part of the statement is wrong, the answer is false."},{"h":"Matching","prompt":"How can you make matching easier?","t":"Match the ones you are sure of first. Cross out each option as you use it. There may be an extra option that matches nothing."},{"h":"Write one…","prompt":"What is the smallest answer that earns the mark?","t":"Give exactly what the question asks for. If it says ‘one’, write one thing. Extra answers do not earn extra marks."},{"h":"Compare (3 marks)","prompt":"What do you need for full marks when asked about two people?","t":"Say something about each person, then add evidence or a link word such as ‘whereas’ or ‘but’."}],"side":{"title":"Where the marks come from","items":[{"h":"Choose and match","t":"Multiple choice, true or false and matching questions are 1 mark each."},{"h":"Write a short answer","t":"Most written questions are 1 or 2 marks. Aim for one clear point per mark."},{"h":"Compare","t":"One question is worth 3 marks. Use both men and evidence."}]}},{"type":"extract","key":"p3","short":"Passage","mins":6,"label":"Practice passage","title":"Act 1, Scene 3: the meeting on the heath","sub":"Lines 39 to 92. Use this passage for today’s questions.","scene":"1.3","setup":"This is the passage from Lesson 1. Today you will answer questions on it. Read it again with the questions in mind: what does each man say and do?","think":"With a partner (30 seconds): which lines would you use to show how Macbeth and Banquo are different?","thinkSecs":30,"task":"Underline evidence you could use to compare Macbeth and Banquo. Label it M or B.","taskSupport":"Underline one thing Macbeth says and one thing Banquo says. Label them M and B.","taskStretch":"Pick the two strongest quotations for comparing the men. Explain why you chose them.","gloss":[["aught","anything"],["fantastical","imaginary"],["rapt","completely absorbed"],["hereafter","in the future"],["corporal","having a body"],["insane root","a plant that makes you see things"],["get (kings)","father (kings)"]],"lines":[{"k":"sp","t":"Macbeth"},{"k":"ln","n":39,"t":"So foul and fair a day I have not seen."},{"k":"sp","t":"Banquo"},{"k":"ln","n":40,"t":"How far is ’t called to Forres?—What are these,"},{"k":"ln","n":41,"t":"So withered, and so wild in their attire,"},{"k":"ln","n":42,"t":"That look not like th’ inhabitants o’ th’ Earth"},{"k":"ln","n":43,"t":"And yet are on ’t?—Live you? Or are you aught"},{"k":"ln","n":44,"t":"That man may question? You seem to understand"},{"k":"ln","n":45,"t":"me"},{"k":"ln","n":46,"t":"By each at once her choppy finger laying"},{"k":"ln","n":47,"t":"Upon her skinny lips. You should be women,"},{"k":"ln","n":48,"t":"And yet your beards forbid me to interpret"},{"k":"ln","n":49,"t":"That you are so."},{"k":"sp","t":"Macbeth"},{"k":"ln","n":50,"t":"Speak if you can. What are you?"},{"k":"sp","t":"First Witch"},{"k":"ln","n":51,"t":"All hail, Macbeth! Hail to thee, Thane of Glamis!"},{"k":"sp","t":"Second Witch"},{"k":"ln","n":52,"t":"All hail, Macbeth! Hail to thee, Thane of Cawdor!"},{"k":"sp","t":"Third Witch"},{"k":"ln","n":53,"t":"All hail, Macbeth, that shalt be king hereafter!"},{"k":"sp","t":"Banquo"},{"k":"ln","n":54,"t":"Good sir, why do you start and seem to fear"},{"k":"ln","n":55,"t":"Things that do sound so fair?—I’ th’ name of truth,"},{"k":"ln","n":56,"t":"Are you fantastical, or that indeed"},{"k":"ln","n":57,"t":"Which outwardly you show? My noble partner"},{"k":"ln","n":58,"t":"You greet with present grace and great prediction"},{"k":"ln","n":59,"t":"Of noble having and of royal hope,"},{"k":"ln","n":60,"t":"That he seems rapt withal. To me you speak not."},{"k":"ln","n":61,"t":"If you can look into the seeds of time"},{"k":"ln","n":62,"t":"And say which grain will grow and which will not,"},{"k":"ln","n":63,"t":"Speak, then, to me, who neither beg nor fear"},{"k":"ln","n":64,"t":"Your favors nor your hate."},{"k":"sp","t":"First Witch"},{"k":"ln","n":65,"t":"Hail!"},{"k":"sp","t":"Second Witch"},{"k":"ln","n":66,"t":"Hail!"},{"k":"sp","t":"Third Witch"},{"k":"ln","n":67,"t":"Hail!"},{"k":"sp","t":"First Witch"},{"k":"ln","n":68,"t":"Lesser than Macbeth and greater."},{"k":"sp","t":"Second Witch"},{"k":"ln","n":69,"t":"Not so happy, yet much happier."},{"k":"sp","t":"Third Witch"},{"k":"ln","n":70,"t":"Thou shalt get kings, though thou be none."},{"k":"ln","n":71,"t":"So all hail, Macbeth and Banquo!"},{"k":"sp","t":"First Witch"},{"k":"ln","n":72,"t":"Banquo and Macbeth, all hail!"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":73,"t":"Stay, you imperfect speakers. Tell me more."},{"k":"ln","n":74,"t":"By Sinel’s death I know I am Thane of Glamis."},{"k":"ln","n":75,"t":"But how of Cawdor? The Thane of Cawdor lives"},{"k":"ln","n":76,"t":"A prosperous gentleman, and to be king"},{"k":"ln","n":77,"t":"Stands not within the prospect of belief,"},{"k":"ln","n":78,"t":"No more than to be Cawdor. Say from whence"},{"k":"ln","n":79,"t":"You owe this strange intelligence or why"},{"k":"ln","n":80,"t":"Upon this blasted heath you stop our way"},{"k":"ln","n":81,"t":"With such prophetic greeting. Speak, I charge you."},{"k":"st","t":"Witches vanish.","key":"s81"},{"k":"sp","t":"Banquo"},{"k":"ln","n":82,"t":"The earth hath bubbles, as the water has,"},{"k":"ln","n":83,"t":"And these are of them. Whither are they vanished?"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":84,"t":"Into the air, and what seemed corporal melted,"},{"k":"ln","n":85,"t":"As breath into the wind. Would they had stayed!"},{"k":"sp","t":"Banquo"},{"k":"ln","n":86,"t":"Were such things here as we do speak about?"},{"k":"ln","n":87,"t":"Or have we eaten on the insane root"},{"k":"ln","n":88,"t":"That takes the reason prisoner?"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":89,"t":"Your children shall be kings."},{"k":"sp","t":"Banquo"},{"k":"ln","n":90,"t":"You shall be king."},{"k":"sp","t":"Macbeth"},{"k":"ln","n":91,"t":"And Thane of Cawdor too. Went it not so?"},{"k":"sp","t":"Banquo"},{"k":"ln","n":92,"t":"To th’ selfsame tune and words.—Who’s here?"},{"k":"st","t":"Enter Ross and Angus.","key":"s92"}],"notes":[{"id":"pn3-1","at":39,"phrase":"So foul and fair","title":"Macbeth echoes the witches","meaning":"The day is ‘foul’ (stormy weather) but also ‘fair’ (a great victory).","effect":"These are Macbeth’s very first words in the play, and they copy the witches’ ‘fair is foul’ pattern before he has heard them speak. It suggests he already belongs in their world of confusion.","ask":"Why might Shakespeare give Macbeth these words as his first line?","tags":["language","fate","appearance","key13"],"support":"Macbeth’s first line has two opposite words: ___ and ___. This links him to the witches because ___.","stretch":"Is Macbeth already ‘in their world’, or just describing the weather? Argue both sides.","revise":false},{"id":"pn3-2","from":41,"to":42,"title":"Banquo studies the witches","meaning":"‘Withered’ means shrivelled. Banquo says they don’t look as if they belong on Earth, yet they are standing on it.","effect":"Banquo notices details and asks careful questions. Compare this with how Macbeth reacts.","tags":["banquo","appearance"],"revise":false},{"id":"pn3-3","at":48,"phrase":"your beards forbid me to interpret","title":"Not what they seem","meaning":"They look like women but have beards, so Banquo can’t work out what they are.","effect":"Another example of appearance not matching reality. It also makes the witches unsettling and unnatural.","tags":["appearance","language"],"revise":false},{"id":"pn3-4","from":51,"to":53,"title":"Three prophecies","meaning":"Three greetings, three titles: Thane of Glamis (what he already is), Thane of Cawdor (what he doesn’t know he is), and king hereafter (in the future).","effect":"The first two are true. The third is the dangerous one. Notice the pattern of three, which is typical of spells.","ask":"Which prophecy might be the most tempting, and why?","tags":["fate","ambition","key13"],"support":"The three greetings are ___, ___ and ___. The most dangerous is ___ because ___.","stretch":"Why might Shakespeare give three greetings rather than one? What effect does the build-up have?","revise":false},{"id":"pn3-5","from":54,"to":55,"title":"Banquo notices Macbeth’s fear","meaning":"Banquo sees Macbeth ‘start’ (jump in fear) even though the news sounds good (‘fair’).","effect":"Why would good news frighten a loyal soldier? It suggests Macbeth already has a dark thought in his mind. Banquo spots it, and so does the audience.","ask":"What might Macbeth be afraid of?","tags":["ambition","banquo","key13"],"support":"Banquo notices that Macbeth ___ even though the news sounds ___. This suggests Macbeth is thinking about ___.","stretch":"Why does Banquo’s question make the audience suspect Macbeth before he says anything?","revise":false},{"id":"pn3-6","at":56,"phrase":"Are you fantastical","title":"Banquo questions the witches","meaning":"‘Fantastical’ means imaginary. Banquo asks: are you real, or only in our imagination?","effect":"Banquo stays sceptical and wants proof. He asks whether they are what they seem, whereas Macbeth only asks them to say more.","tags":["banquo","appearance","key13"],"support":"Banquo asks if the witches are real. This shows he is ___ (cautious or trusting) because ___.","stretch":"‘Fantastical’ and ‘fair is foul’ both question what is real. How do they connect?","revise":false},{"id":"pn3-7","from":61,"to":64,"title":"Banquo is not afraid","meaning":"He uses a metaphor: the future is like seeds, and the witches can tell which will grow. He says he neither begs for their favour nor fears their hatred.","effect":"Banquo stays independent and calm. Macbeth is fascinated and shaken. Great evidence for your comparison.","ask":"Which of them seems more in control?","tags":["banquo","language","key13"],"support":"Banquo says he does not ___ or ___ the witches. This shows he is ___.","stretch":"The seeds-and-grain metaphor imagines the future as something that grows. What does this suggest about fate?","revise":false},{"id":"pn3-8","from":68,"to":69,"title":"More paradoxes","meaning":"Banquo will be lesser than Macbeth (never king) but greater (his family will be kings). He is less fortunate, but also happier.","effect":"The witches keep speaking in riddles, like ‘fair is foul’ and ‘lost and won’. Riddles can mislead: they tell the truth in a confusing way.","tags":["language","banquo","fate"],"revise":false},{"id":"pn3-9","at":70,"phrase":"Thou shalt get kings, though thou be none.","title":"Banquo’s prophecy","meaning":"‘Get’ means father. You will father kings even though you won’t be king yourself.","effect":"Banquo will never be king, but his descendants will. This will trouble Macbeth later. King James claimed to be descended from Banquo, so Shakespeare was flattering the king.","tags":["banquo","fate","context","key13"],"support":"The witches tell Banquo his ___ will be kings. This could make Macbeth feel ___.","stretch":"Shakespeare flatters King James through Banquo. Does knowing that change how we see Banquo?","revise":false},{"id":"pn3-10","at":73,"phrase":"Stay, you imperfect speakers. Tell me more.","title":"Macbeth wants more","meaning":"‘Stay’ means stop. He calls them ‘imperfect speakers’ because they have given him only half the story.","effect":"Macbeth gives orders and is hungry for more. Banquo asks whether they can be trusted, but Macbeth only asks for more. This is one of the first signs of his ambition.","ask":"What does Macbeth want? What does Banquo want?","tags":["ambition","banquo","key13"],"support":"Macbeth says ‘Tell me more’. This shows he is ___ because ___.","stretch":"‘Imperfect speakers’: is Macbeth criticising the witches, or revealing his own greed?","revise":false},{"id":"pn3-11","from":75,"to":78,"title":"Macbeth argues it away","meaning":"Cawdor is alive and doing well. Being king is even harder to believe than being Cawdor.","effect":"Macbeth says it is impossible, but he keeps asking. He is not planning anything yet, but the idea has caught him.","tags":["ambition"],"revise":false},{"id":"pn3-12","stage":"s81","phrase":"Witches vanish.","title":"They disappear","meaning":"The witches vanish, which is proof that they are supernatural.","effect":"Because they leave no trace, the men can doubt whether it really happened. Banquo doubts it, while Macbeth wishes they had stayed. Their reactions split here.","tags":["fate"],"revise":false},{"id":"pn3-13","from":82,"to":83,"title":"Banquo explains it away","meaning":"Banquo says the earth has bubbles, like water: they appear and pop. The witches were like bubbles, here and gone.","effect":"He looks for a natural explanation. Banquo prefers logic to magic.","tags":["banquo"],"revise":false},{"id":"pn3-14","from":86,"to":88,"title":"Banquo doubts his senses","meaning":"The ‘insane root’ is a plant that could make people see things or lose their reason. Banquo asks: did we eat something that ‘takes the reason prisoner’?","effect":"Banquo’s first thought is that they were tricked, not chosen. Macbeth’s first thought is ‘I wish they had stayed’. Sceptic against believer.","ask":"Which reaction is wiser? Which is more dangerous?","tags":["banquo","key13"],"support":"Banquo’s first thought is that ___. Macbeth’s first thought is ___.","stretch":"Which reaction would a Jacobean audience find more sensible? Why?","revise":false},{"id":"pn3-15","from":89,"to":90,"title":"Each remembers the other’s prophecy","meaning":"Macbeth repeats Banquo’s prediction (‘Your children shall be kings’), and Banquo repeats Macbeth’s.","effect":"Macbeth mentions Banquo’s prophecy first. Later he cannot bear the thought of Banquo’s children being kings, and has Banquo killed (Act 3).","tags":["banquo","ambition","ahead"],"revise":false}]},{"type":"practice","key":"h3-p1","short":"Quick-fire","mins":10,"title":"Part 1: quick-fire questions","sub":"10 marks. Vote on mini-whiteboards, then tap a question to check.","timer":300,"tipsTitle":"Top tips","tips":[{"h":"Read the line numbers","t":"The question tells you where to look. Go there first."},{"h":"Decide before you look","t":"Have your own answer ready, then check the options."},{"h":"Mark it yourself","t":"Tick or cross each answer on your handout, then add up your marks."}],"qs":[{"k":"mc","n":1,"marks":1,"q":"Q1. Why does Banquo ask Macbeth why he ‘starts’? (lines 54–55)","opts":["Macbeth trips over a stone.","Macbeth looks afraid of good news.","Macbeth is angry with him.","Macbeth is cold."],"a":"B. Macbeth looks afraid even though the news sounds good."},{"k":"mc","n":2,"marks":1,"q":"Q2. What does Macbeth ask the witches to do? (line 73)","opts":["Leave quickly.","Tell him more.","Bow to him.","Prove they are real."],"a":"B. He says ‘Tell me more’."},{"k":"mc","n":3,"marks":1,"q":"Q3. What does ‘fantastical’ mean in line 56?","opts":["Wonderful","Imaginary","Dangerous","Old"],"a":"B. Imaginary. Banquo asks whether the witches are real or only in the imagination."},{"k":"mc","n":4,"marks":1,"q":"Q4. How does Macbeth feel when the witches vanish? (line 85)","opts":["Relieved","He wishes they had stayed","Angry with Banquo","Sure it was a dream"],"a":"B. ‘Would they had stayed!’"},{"k":"tf","n":5,"marks":3,"q":"Q5–7. Write True or False for each statement.","items":["5. Banquo is afraid of what the witches might say to him. (lines 61–64)","6. The witches tell Banquo his children will be kings. (line 70)","7. Macbeth says it is easy to believe he could be king. (lines 76–78)"],"a":"5 False (he says he neither begs nor fears their favours). 6 True. 7 False (he says it is beyond belief)."},{"k":"match","n":8,"marks":3,"q":"Q8–10. Match each quotation to what it shows.","left":["8. ‘Stay, you imperfect speakers. Tell me more.’ (Macbeth)","9. ‘…who neither beg nor fear / Your favors nor your hate.’ (Banquo)","10. ‘Would they had stayed!’ (Macbeth)"],"right":["a. He wants to hear more.","b. He is calm and not afraid.","c. He regrets that they have gone.","d. He wants the witches to stay."],"a":"8 a, 9 b, 10 c. Option d matches nothing."}]},{"type":"practice","key":"h3-p2","short":"Written","mins":18,"title":"Part 2: written questions","sub":"10 marks. Write your answers first. Then tap to see what earns the marks.","timer":600,"tipsTitle":"What earns marks","tips":[{"h":"1 mark","t":"One clear point. Do not add extra points."},{"h":"2 marks","t":"Two points, or one point with evidence."},{"h":"3 marks","t":"Both men, plus evidence or a link word such as ‘whereas’."}],"qs":[{"k":"short","n":11,"marks":1,"starter":"Banquo notices that Macbeth …","q":"Q11. Write down one thing Banquo notices about Macbeth’s reaction. (lines 54–55)","a":"He notices Macbeth ‘starts’ / seems to fear even though the news sounds good.","ms":["1 mark for either idea."]},{"k":"short","n":12,"marks":2,"starter":"The witches promise Banquo that his children … but he …","q":"Q12. What do the witches promise Banquo? (lines 68–70)","a":"His children will be kings, but he will not be king himself.","ms":["1 mark: his children (or descendants) will be kings.","1 mark: he will not be king himself (or ‘lesser than Macbeth and greater’)."]},{"k":"short","n":13,"marks":2,"starter":"This shows Macbeth feels … because he wants …","q":"Q13. Macbeth says ‘Stay, you imperfect speakers. Tell me more.’ What does this show about how he feels about the prophecies?","a":"He is eager and wants to know more.","ms":["1 mark: he is eager, interested or excited.","1 mark: a reason or detail (he wants to know how it could happen; he does not want them to leave)."]},{"k":"short","n":14,"marks":2,"starter":"Banquo thinks the witches were … He also wonders whether …","q":"Q14. How does Banquo react when the witches vanish? (lines 82–88)","a":"He looks for an explanation: the witches were like bubbles, or they may have eaten the ‘insane root’.","ms":["1 mark: he thinks they were like bubbles, here and gone.","1 mark: he wonders whether they ate the ‘insane root’ that ‘takes the reason prisoner’."]},{"k":"short","n":15,"marks":3,"starter":"Banquo … whereas Macbeth …","q":"Q15. How is Banquo’s reaction to the witches different from Macbeth’s? Write about both men.","a":"Banquo questions the witches and is not afraid; Macbeth is frightened but keeps asking for more.","ms":["1 mark: something about Banquo (he questions them, is calm, doubts them).","1 mark: something about Macbeth (he is startled, wants more, is tempted).","1 mark: evidence (a quotation) or a clear link such as ‘whereas’."]}]},{"type":"plenary","key":"h3-end","short":"Exit","mins":7,"title":"Exit ticket","ticket":[{"lvl":"core","q":"Give one reason it helps to decide your own answer before reading the multiple-choice options.","a":"So the options cannot trick you. You check your idea against them."},{"lvl":"core","q":"A question asks for ONE thing Banquo notices. How many things should you write?","a":"One. Extra answers do not earn extra marks."},{"lvl":"stretch","q":"Write one sentence comparing Banquo and Macbeth. Use a quotation for each man.","a":"For example: Banquo is calm (‘neither beg nor fear’), whereas Macbeth is hungry for more (‘Tell me more’)."}],"next":"Next lesson: the comprehension on Act 1 Scene 3 (first half), then Duncan names his heir and Lady Macbeth reads a letter."}]},{"title":"Lesson 4","subtitle":"Assessment, then Scenes 1.4 and 1.5","aims":{"li":"To understand how Macbeth reacts when Malcolm is named heir, and how Lady Macbeth responds to the news of the witches.","sc":["I can explain why Malcolm’s new title is a problem for Macbeth, using a short quotation.","I can explain what Lady Macbeth thinks about Macbeth’s character, using ‘milk of human kindness’.","I can describe what Lady Macbeth asks the spirits to do, and what this shows about her."],"stretch":"I can explain how Macbeth and Lady Macbeth both talk about hiding what they really want.","word":{"w":"soliloquy","m":"a speech in which a character speaks their thoughts, alone on stage.","eg":"Lady Macbeth’s speech in 1.5 is a soliloquy. Use the word in one sentence today."},"bridge":"The assessment is done. Now we move on: Duncan is about to name who will be king after him."},"steps":[{"type":"assess","key":"h4-assess","short":"Assess","mins":30,"title":"Assessment","sub":"Act 1 Scene 3","presets":[20,25,30]},{"type":"aims","key":"h4-aims","short":"Aims","mins":3,"title":"Today’s lesson","doNow":{"title":"Do now: predict","qa":[{"q":"Duncan is about to name his heir. Who might it be, and how might Macbeth feel?","a":"Probably his eldest son, Malcolm. Macbeth, who has just been thinking about being king, may feel blocked."},{"q":"Macbeth has sent his wife a letter about the witches. How do you think she will react?","a":"There is no right answer. She might be excited, worried, or start to plan. Watch her first reaction."},{"q":"Is it worse to do something wrong yourself, or to push someone else to do it?","a":"No right answer. Lady Macbeth’s part in the play is a big debate."}]}},{"type":"extract","key":"e6","short":"1.4 Heir","mins":6,"label":"Extract 6","title":"Act 1, Scene 4: Duncan names his heir","sub":"An extract","scene":"1.4","setup":"Duncan is delighted with Macbeth and announces who will be king after him. Notice what Macbeth says to Duncan, and what he says to himself.","think":"With a partner (30 seconds): what does Macbeth say to Duncan, and what does he say to himself? How are they different?","thinkSecs":30,"task":"Underline one line Macbeth says to Duncan and one line from his aside. Write what is different about them.","taskSupport":"Underline ‘The service and the loyalty I owe’ and ‘black and deep desires’. Finish: ‘Macbeth says … but he thinks …’","taskStretch":"Explain how Macbeth’s aside shows ‘fair is foul’ in action. Use one quotation.","gloss":[["heir","the person who will be king next"],["thane","a Scottish lord"],["o’erleap","jump over"],["desires","things you want very much"],["wink at","close the eye to"]],"lines":[{"k":"sp","t":"Duncan"},{"k":"ln","n":13,"t":"There’s no art"},{"k":"ln","n":14,"t":"To find the mind’s construction in the face."},{"k":"ln","n":15,"t":"He was a gentleman on whom I built"},{"k":"ln","n":16,"t":"An absolute trust."},{"k":"st","t":"Enter Macbeth, Banquo, Ross, and Angus.","key":"s16"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":25,"t":"The service and the loyalty I owe"},{"k":"ln","n":26,"t":"In doing it pays itself. Your Highness’ part"},{"k":"gap","t":"[…]"},{"k":"sp","t":"Duncan"},{"k":"ln","n":43,"t":"We will establish our estate upon"},{"k":"ln","n":44,"t":"Our eldest, Malcolm, whom we name hereafter"},{"k":"ln","n":45,"t":"The Prince of Cumberland; which honor must"},{"k":"ln","n":46,"t":"Not unaccompanied invest him only,"},{"k":"ln","n":47,"t":"But signs of nobleness, like stars, shall shine"},{"k":"ln","n":48,"t":"On all deservers.—From hence to Inverness"},{"k":"sp","t":"Macbeth (aside)"},{"k":"ln","n":55,"t":"The Prince of Cumberland! That is a step"},{"k":"ln","n":56,"t":"On which I must fall down or else o’erleap,"},{"k":"ln","n":57,"t":"For in my way it lies. Stars, hide your fires;"},{"k":"ln","n":58,"t":"Let not light see my black and deep desires."},{"k":"ln","n":59,"t":"The eye wink at the hand, yet let that be"},{"k":"ln","n":60,"t":"Which the eye fears, when it is done, to see."},{"k":"st","t":"He exits.","key":"s60"}],"notes":[{"id":"n6-1","from":13,"to":16,"title":"Duncan can’t read faces","meaning":"Duncan says nobody can tell what a person is thinking just by looking at their face. He had trusted the old Thane of Cawdor completely, and was betrayed.","effect":"Dramatic irony: Duncan says this just before he trusts Macbeth just as completely. The audience has heard Macbeth’s dark thoughts; Duncan has not.","ask":"Who else might be hiding their real thoughts behind a friendly face?","tags":["irony","appearance","ahead"],"revise":true,"support":"Duncan says you cannot ___ someone’s thoughts from their ___. This is ironic because he is about to ___ Macbeth.","stretch":"How does this line connect to ‘fair is foul’ from 1.1?"},{"id":"n6-2","from":25,"to":26,"title":"Loyal words","meaning":"Macbeth tells Duncan that serving and being loyal to the king is its own reward.","effect":"Macbeth says exactly the right thing to the king. Compare it with his private thoughts in the aside: public words and private thoughts no longer match.","ask":"Is Macbeth lying here, or does part of him mean it?","tags":["appearance","ambition"]},{"id":"n6-3","from":43,"to":46,"title":"Malcolm is named heir","meaning":"Duncan announces that his eldest son Malcolm will be king after him. ‘Prince of Cumberland’ is the title of the person who will inherit the throne.","effect":"This blocks Macbeth’s route. In 1.3 he thought ‘chance may crown me’. Now the crown has been promised to someone else, so waiting for chance is no longer enough.","ask":"How does this news change Macbeth’s plan from 1.3?","tags":["ambition","fate"],"revise":true,"support":"Before this, Macbeth thought the crown might come by ___. Now Malcolm is ___, so Macbeth ___.","stretch":"Why might Shakespeare have Duncan announce Malcolm just after praising Macbeth so warmly?"},{"id":"n6-4","at":47,"phrase":"like stars, shall shine","title":"Duncan’s stars","meaning":"Duncan says that ‘signs of nobleness’ will shine like stars on everyone who deserves them.","effect":"The star image is warm and hopeful. Macbeth will pick it up in his aside and turn it upside down, asking the stars to hide.","tags":["language","ahead"]},{"id":"n6-5","from":55,"to":56,"title":"A step in the way","meaning":"Macbeth says Malcolm’s new title is like a step on a staircase. He must either trip over it (‘fall down’) or jump over it (‘o’erleap’).","effect":"A metaphor: Malcolm is an obstacle, not a person. Notice the choice between falling and leaping: Macbeth is already thinking about how to get past him.","ask":"What does it suggest that Macbeth talks about Malcolm as a ‘step’?","tags":["ambition","language"],"revise":true,"support":"Macbeth calls Malcolm’s title a ‘step’. This shows he sees Malcolm as ___ because ___.","stretch":"Compare this staircase image with the horse-rider image in 1.7 (‘vaulting ambition’). What do they have in common?"},{"id":"n6-6","at":57,"phrase":"Stars, hide your fires","title":"Hide the stars","meaning":"Macbeth speaks to the stars and asks them to hide their light.","effect":"He wants darkness, so that nobody (not even the heavens) can see his thoughts. Compare Duncan’s stars: light and honour for Duncan, darkness for Macbeth.","tags":["language","appearance"],"revise":true},{"id":"n6-7","at":58,"phrase":"black and deep desires","title":"Black and deep desires","meaning":"Macbeth admits his wishes are dark and hidden deep inside him.","effect":"He knows they are wrong: ‘black’ means evil, and he wants to hide them. This is the first time he calls his ambition a ‘desire’ he is ashamed of.","ask":"Why do you think Macbeth wants to hide his desires from the stars?","tags":["ambition","language"]},{"id":"n6-8","from":59,"to":60,"title":"The eye and the hand","meaning":"Macbeth wants his eye to look away while his hand acts, even though the eye will be afraid of what is done.","effect":"He wants to do the deed without facing it. It suggests he already knows that seeing what he has done will horrify him (like the ‘horrid image’ in 1.3).","tags":["ambition","ahead"]}]},{"type":"link","key":"l6","short":"What next","mins":2,"title":"What happens next","text":"Duncan announces that his eldest son, {{Malcolm}}, will be the next king and gives him the title Prince of {{Cumberland}}. Macbeth is now blocked: the crown will not simply fall to him. In an {{aside}} he calls Malcolm a ‘step’ in his way and asks the stars to hide their {{fires}}, so that no one can see his ‘black and deep desires’. Duncan, who cannot read faces, says he will stay as a {{guest}} at Macbeth’s castle.","ext":"In 1.3 Macbeth says ‘chance may crown me’. In 1.4 he says Malcolm is ‘in my way’. What has changed?","track":"Tracker: add ‘The Prince of Cumberland! That is a step…’ to the ambition grid. How is Macbeth’s attitude different from 1.3?","hinge":{"q":"Why is Malcolm being named heir a problem for Macbeth?","opts":["Malcolm is a better soldier.","It blocks Macbeth’s way to the crown.","Duncan no longer trusts Macbeth.","Macbeth wanted to be a prince."],"correct":1,"why":"The crown will now pass to Malcolm. Macbeth cannot wait for chance: he calls the title a ‘step’ he must fall down or leap over."}},{"type":"extract","key":"e7","short":"1.5 Letter","mins":9,"label":"Extract 7","title":"Act 1, Scene 5: Lady Macbeth","sub":"An extract","scene":"1.5","setup":"Lady Macbeth has read her husband’s letter about the witches. Notice what she says about Macbeth’s nature, and what she asks the spirits to do to her.","think":"With a partner (30 seconds): what does Lady Macbeth think Macbeth is like? Find one word or phrase.","thinkSecs":30,"task":"Underline the phrase that shows what Lady Macbeth thinks is Macbeth’s weakness. Circle one command she gives the spirits.","taskSupport":"Underline ‘milk of human kindness’. Finish: ‘Lady Macbeth thinks Macbeth is too … to …’","taskStretch":"Compare what Lady Macbeth says about Macbeth’s nature with what the Captain said about him in 1.2. What is different?","gloss":[["nature","personality"],["kindness","gentleness"],["illness","wickedness, ruthlessness"],["remorse","guilt and pity"],["unsex","take away my womanly softness"],["gall","bitter poison"],["beguile","trick"]],"lines":[{"k":"gap","t":"[…Lady Macbeth has read Macbeth’s letter about the witches…]"},{"k":"sp","t":"Lady Macbeth"},{"k":"ln","n":15,"t":"Glamis thou art, and Cawdor, and shalt be"},{"k":"ln","n":16,"t":"What thou art promised. Yet do I fear thy nature;"},{"k":"ln","n":17,"t":"It is too full o’ th’ milk of human kindness"},{"k":"ln","n":18,"t":"To catch the nearest way. Thou wouldst be great,"},{"k":"ln","n":19,"t":"Art not without ambition, but without"},{"k":"ln","n":20,"t":"The illness should attend it. What thou wouldst"},{"k":"gap","t":"[…a messenger brings news that King Duncan is coming to stay tonight…]"},{"k":"sp","t":"Lady Macbeth"},{"k":"ln","n":45,"t":"The raven himself is hoarse"},{"k":"ln","n":46,"t":"That croaks the fatal entrance of Duncan"},{"k":"ln","n":47,"t":"Under my battlements. Come, you spirits"},{"k":"ln","n":48,"t":"That tend on mortal thoughts, unsex me here,"},{"k":"ln","n":49,"t":"And fill me from the crown to the toe top-full"},{"k":"ln","n":50,"t":"Of direst cruelty. Make thick my blood."},{"k":"ln","n":51,"t":"Stop up th’ access and passage to remorse,"},{"k":"ln","n":52,"t":"That no compunctious visitings of nature"},{"k":"ln","n":53,"t":"Shake my fell purpose, nor keep peace between"},{"k":"ln","n":54,"t":"Th’ effect and it. Come to my woman’s breasts"},{"k":"ln","n":55,"t":"And take my milk for gall, you murd’ring ministers,"},{"k":"gap","t":"[…Macbeth arrives…]"},{"k":"sp","t":"Lady Macbeth"},{"k":"ln","n":73,"t":"Your face, my thane, is as a book where men"},{"k":"ln","n":74,"t":"May read strange matters. To beguile the time,"},{"k":"ln","n":75,"t":"Look like the time. Bear welcome in your eye,"},{"k":"ln","n":76,"t":"Your hand, your tongue. Look like th’ innocent"},{"k":"ln","n":77,"t":"flower,"},{"k":"ln","n":78,"t":"But be the serpent under ’t. He that’s coming"}],"notes":[{"id":"n7-1","from":16,"to":17,"title":"Too kind to be king?","meaning":"Lady Macbeth says she fears Macbeth’s nature. He is too full of the ‘milk of human kindness’, meaning too gentle and kind, to take the quickest way to the crown.","effect":"The first thing we learn from her is what she thinks of him: kind, not ruthless. That is very different from the violent soldier in 1.2, and it shows how well (or how little) she knows him.","ask":"Is she right? What do you know about Macbeth so far?","tags":["lady","ambition"],"revise":true,"support":"Lady Macbeth thinks Macbeth is too ___ to take ‘the nearest way’ to the crown, which means ___.","stretch":"Lady Macbeth calls Macbeth kind; the Captain called him ‘brave’. Which is closer to the truth?"},{"id":"n7-2","from":18,"to":20,"title":"Ambition without the ‘illness’","meaning":"She says Macbeth wants to be great and is not without ambition, but he does not have the ‘illness’ (wickedness or ruthlessness) that should go with it.","effect":"She names his ambition: it is his own, and she already knows it. Her plan is to supply what he lacks. That is a key idea for your essay: who is responsible for Macbeth’s ambition?","ask":"Does Lady Macbeth create his ambition, or does she notice it?","tags":["lady","ambition"],"revise":true,"support":"Lady Macbeth says Macbeth has ___ but not the ___ that goes with it.","stretch":"Use 1.3 to argue that Macbeth’s ambition began before Lady Macbeth appeared."},{"id":"n7-3","from":45,"to":47,"title":"The raven","meaning":"A raven is a bird linked with death. Lady Macbeth says even the raven is hoarse from croaking about Duncan’s ‘fatal entrance’ into her castle.","effect":"She hears the news that Duncan is coming and decides on the spot that he will die. She calls the castle ‘my battlements’. Notice how fast she moves from news to murder.","tags":["lady","language","ahead"]},{"id":"n7-4","from":48,"to":50,"title":"Unsex me here","meaning":"She asks evil spirits to take away her womanly softness (‘unsex me’) and fill her with cruelty from head to toe.","effect":"Commands (‘Come’, ‘unsex’, ‘fill’, ‘Make thick my blood’) show she is in control. To a Jacobean audience, a woman calling on evil spirits and rejecting gentleness was shocking.","ask":"What does it suggest that she needs help to be this cruel?","tags":["lady","language","context"],"revise":true,"support":"Lady Macbeth asks the spirits to ___ her. This shows she wants to be ___ instead of ___.","stretch":"She chooses cruelty; Macbeth is pulled towards it. Which is more shocking, and why?"},{"id":"n7-5","from":51,"to":53,"title":"No room for guilt","meaning":"She asks to be stopped from feeling remorse (guilt and pity) so that nothing shakes her ‘fell’ (deadly) purpose.","effect":"She tries to shut down her conscience before she has even done anything. In Act 5 the guilt she blocks out here returns.","tags":["lady","ahead"]},{"id":"n7-6","from":54,"to":55,"title":"Milk for gall","meaning":"She asks the spirits to take her ‘milk’ (the source of a mother’s kindness) and turn it into ‘gall’ (bitter poison).","effect":"Milk appeared earlier: she called Macbeth too full of the ‘milk of human kindness’. Now she gets rid of her own. She removes the very thing she thinks he is too full of.","tags":["lady","language"],"revise":true,"support":"Milk stands for ___ and gall stands for ___. She wants to swap one for the other.","stretch":"How does the milk image link Lady Macbeth’s speech to what she said about Macbeth’s nature?"},{"id":"n7-7","from":73,"to":74,"title":"A face like a book","meaning":"She tells Macbeth his face is like a book that people can read, so he must hide his thoughts and ‘look like the time’ (look as the occasion requires).","effect":"In 1.4 Duncan said there is ‘no art’ to read a mind in a face. Lady Macbeth can read Macbeth’s face easily. She sees the danger of him giving himself away.","tags":["lady","appearance","irony"],"revise":true,"support":"Lady Macbeth says Macbeth’s face is like a ___. She warns him because people might ___.","stretch":"Duncan cannot read faces but Lady Macbeth can. What does that say about each of them?"},{"id":"n7-8","from":75,"to":78,"title":"The innocent flower and the serpent","meaning":"She tells Macbeth to look welcoming and friendly on the outside (‘the innocent flower’) but be dangerous underneath (‘the serpent’).","effect":"This is ‘fair is foul’ turned into instructions. A serpent hiding under a flower is a famous image of evil (like the snake in the Garden of Eden). She teaches Macbeth to deceive.","ask":"Which earlier line does this remind you of?","tags":["lady","appearance","language"],"revise":true,"support":"She tells Macbeth to look like a ___ but to be a ___. This means he should ___.","stretch":"How does this instruction connect to ‘Fair is foul, and foul is fair’ (1.1)?"}]},{"type":"link","key":"l7","short":"What next","mins":3,"title":"What happens next","text":"Lady Macbeth reads Macbeth’s {{letter}} about the witches. She fears he is too full of the ‘milk of human {{kindness}}’ to take the ‘nearest way’ to the crown. She calls on spirits to {{unsex}} her and fill her with cruelty. When Macbeth arrives she tells him to ‘look like th’ innocent {{flower}}’ but ‘be the {{serpent}} under ’t’, and says she will take charge of the {{plan}}.","ext":"Lady Macbeth says Macbeth has ambition but not ‘the illness’ that should go with it. Is she right? Use 1.3 and 1.4.","track":"Tracker: start the Lady Macbeth quote bank with ‘milk of human kindness’, ‘unsex me here’ and ‘look like th’ innocent flower’.","hinge":{"q":"What does Lady Macbeth mean by ‘the milk of human kindness’?","opts":["Macbeth drinks too much milk.","Macbeth is too gentle and kind to do something so cruel.","Macbeth loves his mother.","Macbeth is a good farmer."],"correct":1,"why":"‘Milk of human kindness’ means gentleness. She fears he is too kind to take the quickest way to the crown, which is murder."}},{"type":"plenary","key":"h4-end","short":"Exit","mins":3,"title":"Exit ticket","ticket":[{"lvl":"core","q":"Why is Malcolm’s new title a problem for Macbeth?","a":"It blocks his way to the crown. Malcolm will be king next, so Macbeth cannot just wait for chance."},{"lvl":"core","q":"What does Lady Macbeth mean by ‘the milk of human kindness’?","a":"That Macbeth is too gentle and kind to do what it takes to become king."},{"lvl":"stretch","q":"How is Lady Macbeth’s reaction to the witches’ news different from Macbeth’s? Use one quotation for each.","a":"Macbeth is frightened and unsure (‘horrid image’, ‘chance may crown me’). Lady Macbeth is decisive: she calls on spirits to ‘unsex’ her and takes charge of the plan."}],"next":"Next lesson: we improve our assessment answers, then Duncan arrives at the castle and Lady Macbeth puts pressure on Macbeth."}]},{"title":"Lesson 5","subtitle":"Scenes 1.6 and 1.7","aims":{"li":"To improve my comprehension answers, and to explain how Shakespeare uses dramatic irony in 1.6 and how Lady Macbeth puts pressure on Macbeth in 1.7.","sc":["I can improve one of my answers using my feedback.","I can explain what dramatic irony is and find an example in 1.6.","I can explain how Lady Macbeth persuades Macbeth to go ahead with the murder."],"stretch":"I can explain how Macbeth’s attitude to the murder changes across Scene 7.","word":{"w":"dramatic irony","m":"when the audience knows something that a character does not.","eg":"Duncan praises the castle, but the audience knows about the plan. Use the phrase in one sentence today."},"bridge":"Last lesson: Macbeth called Malcolm a ‘step’ in his way, and Lady Macbeth asked the spirits to ‘unsex’ her."},"steps":[{"type":"aims","key":"h5-aims","short":"Aims","mins":4,"title":"Today’s lesson","doNow":{"title":"Do now: what do you remember?","qa":[{"q":"What problem does Malcolm’s new title cause Macbeth?","a":"It blocks his way to the crown: he calls it a ‘step’ he must fall down or leap over."},{"q":"What does Lady Macbeth ask the spirits to do to her?","a":"‘Unsex’ her: take away her womanly softness and fill her with cruelty."},{"q":"What advice does she give Macbeth about his face?","a":"‘Look like th’ innocent flower, but be the serpent under ’t.’"}]}},{"type":"context","key":"h5-dirt","short":"Improve","mins":10,"title":"Improve it","lead":"Read the weak answer. How could you improve it? Then tap to check.","blocks":[{"h":"Add evidence","prompt":"Question: How does Shakespeare show Macbeth is frightened by his own thoughts? Weak answer: ‘Macbeth is scared.’","t":"Better: ‘His hair “unfix[es]” and his heart “knock[s]”, so his body shows his fear.’ Add a short quotation, then say what it shows."},{"h":"Name both people","prompt":"Question: How is Banquo’s reaction different from Macbeth’s? Weak answer: ‘Banquo is different.’","t":"Better: ‘Banquo is suspicious (“can the devil speak true?”), whereas Macbeth is tempted (“Tell me more”).’ Say something about each man and link them."},{"h":"Be specific","prompt":"Question: How has Macbeth’s attitude changed? Weak answer: ‘At the start he is happy and at the end he is sad.’","t":"Better: ‘He begins eager (“The greatest is behind”) but ends leaving it to fate (“Come what come may”).’ Say what he thinks, not just how he feels."}],"side":{"title":"Your improvement routine","items":[{"h":"1. Read","t":"Read your feedback and your mark on the feedback sheet."},{"h":"2. Choose","t":"Find the skill where you lost most marks."},{"h":"3. Redo","t":"Rewrite one answer using the tip above. Then tick the box."}]}},{"type":"extract","key":"e8","short":"1.6 Arrival","mins":5,"label":"Extract 8","title":"Act 1, Scene 6: Duncan arrives","sub":"An extract","scene":"1.6","setup":"Duncan arrives at Macbeth’s castle. The audience knows what he does not. Watch for words that sound warm but feel dangerous.","think":"With a partner (30 seconds): which words make the castle sound safe? Why is that worrying for the audience?","thinkSecs":30,"task":"Underline two words or phrases that make the castle and its owners sound safe and friendly.","taskSupport":"Underline ‘pleasant seat’ and ‘We love him highly’. Finish: ‘This is dramatic irony because the audience knows …’","taskStretch":"Explain how the martlet (a small bird) in Banquo’s speech contrasts with the raven in Lady Macbeth’s speech in 1.5.","gloss":[["seat","position, setting"],["martlet","a house martin (a small bird)"],["approve","prove"],["hostess","the lady of the house"],["hermits","people who pray for you; humble servants"],["host","the man of the house"]],"lines":[{"k":"sp","t":"Duncan"},{"k":"ln","n":1,"t":"This castle hath a pleasant seat. The air"},{"k":"ln","n":2,"t":"Nimbly and sweetly recommends itself"},{"k":"ln","n":3,"t":"Unto our gentle senses."},{"k":"sp","t":"Banquo"},{"k":"ln","n":4,"t":"This guest of summer,"},{"k":"ln","n":5,"t":"The temple-haunting martlet, does approve,"},{"k":"ln","n":6,"t":"By his loved mansionry, that the heaven’s breath"},{"k":"ln","n":7,"t":"Smells wooingly here."},{"k":"st","t":"Enter Lady Macbeth.","key":"s7"},{"k":"sp","t":"Duncan"},{"k":"ln","n":13,"t":"See, see our honored hostess!—"},{"k":"sp","t":"Lady Macbeth"},{"k":"ln","n":18,"t":"All our service,"},{"k":"ln","n":19,"t":"In every point twice done and then done double,"},{"k":"ln","n":20,"t":"Were poor and single business to contend"},{"k":"ln","n":21,"t":"Against those honors deep and broad wherewith"},{"k":"ln","n":22,"t":"Your Majesty loads our house. For those of old,"},{"k":"ln","n":23,"t":"And the late dignities heaped up to them,"},{"k":"ln","n":24,"t":"We rest your hermits."},{"k":"sp","t":"Duncan"},{"k":"ln","n":25,"t":"Where’s the Thane of Cawdor?"},{"k":"gap","t":"[…]"},{"k":"ln","n":30,"t":"To his home before us. Fair and noble hostess,"},{"k":"ln","n":31,"t":"We are your guest tonight."},{"k":"gap","t":"[…]"},{"k":"ln","n":36,"t":"Give me your hand."},{"k":"ln","n":37,"t":"Conduct me to mine host. We love him highly"},{"k":"ln","n":38,"t":"And shall continue our graces towards him."},{"k":"ln","n":39,"t":"By your leave, hostess."},{"k":"st","t":"They exit.","key":"s39"}],"notes":[{"id":"n8-1","from":1,"to":3,"title":"A pleasant place","meaning":"Duncan praises the castle: it is in a pleasant spot and the air is sweet and gentle.","effect":"Dramatic irony: the audience has just heard Lady Macbeth plan Duncan’s death in this very castle. Duncan feels safe; we know he is not.","ask":"How does knowing more than the characters change how you feel?","tags":["irony","appearance"],"revise":true,"support":"Duncan thinks the castle is ___. The audience knows it is ___.","stretch":"‘Nimbly and sweetly’ are soft, gentle words. Why does Shakespeare use them here?"},{"id":"n8-2","from":4,"to":7,"title":"The martlet","meaning":"Banquo describes a house martin (a small bird) that builds its nest where the air is soft and safe. He says the bird proves the air is sweet.","effect":"The gentle bird contrasts with Lady Macbeth’s raven, the bird of death, in 1.5. Even Banquo, who is careful, is fooled by how safe the castle looks.","tags":["irony","banquo","language"]},{"id":"n8-3","at":13,"phrase":"our honored hostess","title":"‘Honored hostess’","meaning":"Duncan calls Lady Macbeth an honoured hostess as she arrives to greet him.","effect":"Duncan thinks of her as a respected friend. The audience knows she has asked spirits to make her cruel. This is dramatic irony: Duncan does not know he is in danger.","tags":["irony","lady"]},{"id":"n8-4","from":18,"to":24,"title":"Lady Macbeth’s welcome","meaning":"Lady Macbeth says that everything she and Macbeth could do for the king, twice over, would be too little to repay his honours. She calls them the king’s ‘hermits’: humble servants who pray for him.","effect":"This is her ‘false face’: exactly what she told Macbeth to do (‘Look like th’ innocent flower’). She knows the truth, so this is deceit, not dramatic irony.","ask":"What is the difference between dramatic irony and deceit?","tags":["lady","appearance"],"revise":false},{"id":"n8-5","from":37,"to":38,"title":"‘We love him highly’","meaning":"Duncan says he loves his host (Macbeth) and will continue to give him honours.","effect":"One of the most ironic lines in the play: Duncan says he loves Macbeth, who plans to kill him. It also deepens Macbeth’s guilt, because Duncan is so trusting.","tags":["irony","ahead"],"revise":true,"support":"Duncan says he ___ Macbeth. This is ironic because Macbeth plans to ___.","stretch":"Why might Shakespeare end the scene on Duncan’s trust, just before Macbeth’s soliloquy?"}]},{"type":"spot","key":"h5-spot","short":"Spot irony","mins":6,"title":"Spot the irony","sub":"Tap the lines that are dramatic irony (the speaker does NOT know the danger). Then check.","tipsTitle":"Remember","tips":[{"h":"Dramatic irony","t":"The audience knows something the character does not."},{"h":"Deceit is different","t":"If the speaker knows the truth and hides it, that is deceit, not dramatic irony."}],"items":[{"t":"‘This castle hath a pleasant seat.’ (Duncan)","irony":true,"why":"Duncan feels safe. The audience knows Lady Macbeth plans his death here."},{"t":"‘All our service, / In every point twice done and then done double.’ (Lady Macbeth)","irony":false,"why":"Lady Macbeth knows exactly what she is doing. This is her ‘false face’ (deceit), not dramatic irony."},{"t":"‘See, see our honored hostess!’ (Duncan)","irony":true,"why":"Duncan trusts the woman who has asked spirits to make her cruel."},{"t":"‘Where’s the Thane of Cawdor?’ (Duncan)","irony":false,"why":"A plain question with no hidden meaning."},{"t":"‘We are your guest tonight.’ (Duncan)","irony":true,"why":"Duncan calls himself their guest. The audience knows what the hosts plan."},{"t":"‘We rest your hermits.’ (Lady Macbeth)","irony":false,"why":"She pretends to be humble. Again she knows the truth, so it is deceit."},{"t":"‘We love him highly’ (Duncan, about Macbeth)","irony":true,"why":"Duncan loves the man who plans to kill him."},{"t":"‘This guest of summer, the temple-haunting martlet…’ (Banquo)","irony":true,"why":"Even careful Banquo is fooled by the castle’s safe, sweet feel."}]},{"type":"extract","key":"e9","short":"1.7 Doubts","mins":6,"label":"Extract 9","title":"Act 1, Scene 7: Macbeth’s doubts","sub":"An extract","scene":"1.7","setup":"Macbeth is alone, before Lady Macbeth arrives. Listen for his reasons against murdering Duncan, and the one thing pushing him to do it.","think":"With a partner (30 seconds): find one reason Macbeth gives NOT to kill Duncan.","thinkSecs":30,"task":"Underline one reason Macbeth gives not to kill Duncan. Circle the one thing pushing him to do it.","taskSupport":"Finish: ‘Macbeth should not kill Duncan because he is his … and his …. The only thing pushing him is …’","taskStretch":"Explain how the horse-and-rider image in lines 25 to 28 shows the danger of ambition.","gloss":[["assassination","murder of an important person"],["trammel up","catch, as in a net"],["kinsman","relative"],["spur","a sharp point used to make a horse go faster"],["vaulting","leaping"],["o’erleaps","jumps too far"]],"lines":[{"k":"sp","t":"Macbeth"},{"k":"ln","n":1,"t":"If it were done when ’tis done, then ’twere well"},{"k":"ln","n":2,"t":"It were done quickly. If th’ assassination"},{"k":"ln","n":3,"t":"Could trammel up the consequence and catch"},{"k":"ln","n":4,"t":"With his surcease success, that but this blow"},{"k":"ln","n":5,"t":"Might be the be-all and the end-all here,"},{"k":"gap","t":"[…]"},{"k":"ln","n":12,"t":"To our own lips. He’s here in double trust:"},{"k":"ln","n":13,"t":"First, as I am his kinsman and his subject,"},{"k":"ln","n":14,"t":"Strong both against the deed; then, as his host,"},{"k":"ln","n":15,"t":"Who should against his murderer shut the door,"},{"k":"ln","n":16,"t":"Not bear the knife myself. Besides, this Duncan"},{"k":"gap","t":"[…]"},{"k":"ln","n":25,"t":"That tears shall drown the wind. I have no spur"},{"k":"ln","n":26,"t":"To prick the sides of my intent, but only"},{"k":"ln","n":27,"t":"Vaulting ambition, which o’erleaps itself"},{"k":"ln","n":28,"t":"And falls on th’ other—"}],"notes":[{"id":"n9-1","from":1,"to":5,"title":"If it were done…","meaning":"Macbeth says that if the murder could be finished and have no consequences, it would be best to do it quickly. He wants the deed without what comes after it.","effect":"He is thinking about consequences and being caught, not just right and wrong. The repeated ‘done’ sounds like someone going round in circles.","ask":"What is Macbeth most worried about here?","tags":["ambition","language"],"revise":true,"support":"Macbeth wishes the murder could be ___ with no ___.","stretch":"How does the repetition of ‘done’ show that Macbeth’s mind is going round in circles?"},{"id":"n9-2","from":12,"to":16,"title":"Double trust","meaning":"Macbeth lists reasons not to kill Duncan. Duncan is his kinsman and his king (so he should be loyal), and his guest (so as host he should protect him, ‘not bear the knife myself’).","effect":"Macbeth knows exactly why it is wrong. He is not confused about right and wrong, which makes his choice worse.","ask":"Does knowing it is wrong make Macbeth more, or less, guilty?","tags":["ambition","appearance"]},{"id":"n9-3","from":25,"to":26,"title":"No spur","meaning":"A ‘spur’ is the sharp point on a rider’s boot used to make a horse go faster. Macbeth says he has no spur to push his plan forward.","effect":"He admits he has no good reason to kill Duncan. Nothing is pushing him except…","tags":["language","ambition"]},{"id":"n9-4","from":27,"to":28,"title":"Vaulting ambition","meaning":"Macbeth says the only thing pushing him is ‘vaulting ambition’, which is like a rider who jumps so hard that he flies over the horse and falls on the other side.","effect":"Macbeth names his own ambition and predicts that it will overreach and destroy him. He sees the danger and still goes on. The sentence breaks off as Lady Macbeth enters.","ask":"Why is it important that Macbeth says this himself?","tags":["ambition","language","key13"],"revise":true,"support":"Macbeth says the only thing pushing him is ___. Like a rider who ___, ambition can ___.","stretch":"Macbeth sees the danger of ambition and continues anyway. What does this suggest about him as a tragic hero?"}]},{"type":"extract","key":"e10","short":"1.7 Pressure","mins":7,"label":"Extract 10","title":"Act 1, Scene 7: Lady Macbeth persuades","sub":"An extract","scene":"1.7","setup":"Macbeth says he will not go on. Watch what Lady Macbeth says to change his mind, and how Macbeth’s words change.","think":"With a partner (30 seconds): what is Lady Macbeth’s first move to change Macbeth’s mind?","thinkSecs":30,"task":"Underline two different things Lady Macbeth says to persuade Macbeth. Write ‘tactic 1’ and ‘tactic 2’ above them.","taskSupport":"Underline ‘Art thou afeard’ and ‘then you were a man’. Finish: ‘Lady Macbeth makes Macbeth feel …’","taskStretch":"Compare ‘We will proceed no further’ (line 34) with ‘I am settled’ (line 92). Argue whether Lady Macbeth or Macbeth’s own ambition changed his mind.","gloss":[["afeard","afraid"],["durst","dared"],["sticking place","the point where a crossbow string is held tight"],["settled","decided"],["corporal agent","part of the body"],["mock the time","fool everyone around us"]],"lines":[{"k":"sp","t":"Macbeth"},{"k":"ln","n":34,"t":"We will proceed no further in this business."},{"k":"gap","t":"[…he says Duncan has honoured him and people’s good opinion should not be thrown away…]"},{"k":"sp","t":"Lady Macbeth"},{"k":"ln","n":39,"t":"Was the hope drunk"},{"k":"ln","n":40,"t":"Wherein you dressed yourself? Hath it slept since?"},{"k":"ln","n":41,"t":"And wakes it now, to look so green and pale"},{"k":"ln","n":42,"t":"At what it did so freely? From this time"},{"k":"ln","n":43,"t":"Such I account thy love. Art thou afeard"},{"k":"ln","n":44,"t":"To be the same in thine own act and valor"},{"k":"ln","n":45,"t":"As thou art in desire? Wouldst thou have that"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":51,"t":"I dare do all that may become a man."},{"k":"ln","n":52,"t":"Who dares do more is none."},{"k":"sp","t":"Lady Macbeth"},{"k":"ln","n":56,"t":"When you durst do it, then you were a man;"},{"k":"ln","n":57,"t":"And to be more than what you were, you would"},{"k":"ln","n":58,"t":"Be so much more the man."},{"k":"gap","t":"[…she says a mother would break a promise less easily than he has…]"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":68,"t":"If we should fail—"},{"k":"sp","t":"Lady Macbeth"},{"k":"ln","n":69,"t":"We fail?"},{"k":"ln","n":70,"t":"But screw your courage to the sticking place"},{"k":"ln","n":71,"t":"And we’ll not fail."},{"k":"gap","t":"[…she explains a plan to make Duncan’s guards drunk and blame them…]"},{"k":"sp","t":"Macbeth"},{"k":"ln","n":92,"t":"I am settled and bend up"},{"k":"ln","n":93,"t":"Each corporal agent to this terrible feat."},{"k":"ln","n":94,"t":"Away, and mock the time with fairest show."},{"k":"ln","n":95,"t":"False face must hide what the false heart doth"},{"k":"ln","n":96,"t":"know."}],"notes":[{"id":"n10-1","at":34,"phrase":"We will proceed no further in this business.","title":"Macbeth backs out","meaning":"Macbeth tells Lady Macbeth the plan is off.","effect":"His conscience wins for a moment. Compare this with ‘Come what come may’ in 1.3 and ‘Stars, hide your fires’ in 1.4: he keeps changing his mind.","tags":["ambition"]},{"id":"n10-2","from":39,"to":42,"title":"Tactic 1: mock him","meaning":"She says his hope was ‘drunk’. Now, sober, it looks ‘green and pale’ (sick and scared) at what it did so freely.","effect":"She attacks his character with an image of drunkenness and sickness. Her point: your ambition was not real, or you would not be frightened now.","tags":["lady","language"],"revise":true,"support":"Lady Macbeth says Macbeth’s hope was ___ and now looks ___. She is trying to make him feel ___.","stretch":"Why is mocking Macbeth’s ambition a clever way to change his mind?"},{"id":"n10-3","from":43,"to":45,"title":"Tactic 2: call him a coward","meaning":"She asks: are you afraid to be the same in action as you are in desire? In other words, do you only want it, or will you do it?","effect":"Questions make him defend himself. She links love and courage to the murder. Macbeth is known for bravery (1.2), so ‘afeard’ hits him where it hurts.","tags":["lady","ambition"],"revise":true,"support":"Lady Macbeth asks if he is ___. This is a clever tactic because Macbeth is known for being ___.","stretch":"Why is it important that Macbeth was described as ‘brave’ in 1.2, before this speech?"},{"id":"n10-4","from":51,"to":52,"title":"What makes a man","meaning":"Macbeth says he will do anything a man should do. Anyone who does more than that is not a man at all.","effect":"He argues that real manliness has limits. But Lady Macbeth will twist the word ‘man’ into a reason to kill.","tags":["ambition","language"],"revise":true},{"id":"n10-5","from":56,"to":58,"title":"Tactic 3: redefine ‘man’","meaning":"She says that when he was determined to do it, then he was a man, and to do even m
